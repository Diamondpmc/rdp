name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication"
        required: true
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: true
        default: false
        type: boolean

      install_firefox:
        description: "Install Mozilla Firefox"
        required: true
        default: false
        type: boolean

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDP

    steps:

      # =========================================================
      # SYSTEM INFORMATION
      # =========================================================

      - name: Show System Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " WINDOWS RDP ENVIRONMENT"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Windows:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

          Write-Host ""
          Write-Host "Architecture:"
          Write-Host $env:PROCESSOR_ARCHITECTURE

      # =========================================================
      # CREATE RDP USER
      # =========================================================

      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=============================================="
          Write-Host ""

          $Username = $env:RDP_USERNAME

          Write-Host "Username: $Username"
          Write-Host ""

          Write-Host "Current Windows password policy:"
          net accounts

          Write-Host ""

          # Character pools
          $Upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $Lower   = "abcdefghijkmnopqrstuvwxyz"
          $Numbers = "23456789"
          $Special = "!@#$%^&*_-+="

          $AllChars = $Upper + $Lower + $Numbers + $Special

          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          function Get-RandomChar {
              param (
                  [string]$Characters
              )

              $bytes = New-Object byte[] 4
              $rng.GetBytes($bytes)

              $number = [BitConverter]::ToUInt32($bytes, 0)

              return $Characters[$number % $Characters.Length]
          }

          $Password = $null

          for ($attempt = 1; $attempt -le 50; $attempt++) {

              $chars = New-Object System.Collections.Generic.List[char]

              # Guarantee complexity requirements
              $chars.Add((Get-RandomChar $Upper))
              $chars.Add((Get-RandomChar $Lower))
              $chars.Add((Get-RandomChar $Numbers))
              $chars.Add((Get-RandomChar $Special))

              # Fill to 32 characters
              while ($chars.Count -lt 32) {
                  $chars.Add((Get-RandomChar $AllChars))
              }

              # Secure shuffle
              for ($i = $chars.Count - 1; $i -gt 0; $i--) {

                  $bytes = New-Object byte[] 4
                  $rng.GetBytes($bytes)

                  $j = [BitConverter]::ToUInt32(
                      $bytes,
                      0
                  ) % ($i + 1)

                  $tmp = $chars[$i]
                  $chars[$i] = $chars[$j]
                  $chars[$j] = $tmp
              }

              $Candidate = -join $chars

              # Avoid username appearing inside password
              if ($Candidate.ToLower().Contains($Username.ToLower())) {
                  continue
              }

              # Complexity validation
              if ($Candidate -notmatch '[A-Z]') {
                  continue
              }

              if ($Candidate -notmatch '[a-z]') {
                  continue
              }

              if ($Candidate -notmatch '[0-9]') {
                  continue
              }

              if ($Candidate -notmatch '[^a-zA-Z0-9]') {
                  continue
              }

              $Password = $Candidate
              break
          }

          $rng.Dispose()

          if (-not $Password) {
              throw "Unable to generate a compliant Windows password."
          }

          Write-Host "Generated password length: $($Password.Length)"

          # Remove old account if present
          $ExistingUser = Get-LocalUser `
              -Name $Username `
              -ErrorAction SilentlyContinue

          if ($ExistingUser) {

              Write-Host ""
              Write-Host "Existing RDP account found."
              Write-Host "Removing old account..."

              Remove-LocalUser `
                  -Name $Username `
                  -ErrorAction Stop

              Start-Sleep -Seconds 2
          }

          # Create account
          Write-Host ""
          Write-Host "Creating user..."

          $SecurePassword = ConvertTo-SecureString `
              $Password `
              -AsPlainText `
              -Force

          New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -FullName "RDP User" `
              -Description "GitHub Actions RDP User" `
              -PasswordNeverExpires `
              -AccountNeverExpires `
              -ErrorAction Stop

          # Administrators
          Write-Host "Adding user to Administrators..."

          Add-LocalGroupMember `
              -Group "Administrators" `
              -Member $Username `
              -ErrorAction SilentlyContinue

          # Remote Desktop Users
          Write-Host "Adding user to Remote Desktop Users..."

          Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member $Username `
              -ErrorAction SilentlyContinue

          # Verify
          Write-Host ""
          Write-Host "Verifying account..."

          $VerifyUser = Get-LocalUser `
              -Name $Username `
              -ErrorAction Stop

          if (-not $VerifyUser.Enabled) {
              Enable-LocalUser -Name $Username
          }

          Write-Host "Account exists: YES"
          Write-Host "Account enabled: YES"

          # Save for later steps
          "RDP_USERNAME=$Username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$Password" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP CREDENTIALS"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Username: $Username"
          Write-Host "Password: $Password"
          Write-Host ""
          Write-Host "=============================================="

      # =========================================================
      # ENABLE REMOTE DESKTOP
      # =========================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          # Enable RDP
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Allow multiple sessions
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fSingleSessionPerUser" `
            -Value 0

          # Configure NLA
          if ("${{ inputs.disable_nla }}" -eq "true") {

              Write-Host "NLA: DISABLED"

              Set-ItemProperty `
                -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
                -Name "UserAuthentication" `
                -Value 0

          }
          else {

              Write-Host "NLA: ENABLED"

              Set-ItemProperty `
                -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
                -Name "UserAuthentication" `
                -Value 1
          }

          # RDP service
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Start-Service `
            -Name TermService `
            -ErrorAction SilentlyContinue

          # Give Windows time to start listener
          Start-Sleep -Seconds 8

          $Service = Get-Service TermService

          Write-Host ""
          Write-Host "TermService status: $($Service.Status)"
          Write-Host "TermService startup: $($Service.StartType)"

          if ($Service.Status -ne "Running") {
              throw "Remote Desktop Services failed to start."
          }

      # =========================================================
      # FIREWALL
      # =========================================================

      - name: Configure RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONFIGURING RDP FIREWALL"
          Write-Host "=============================================="
          Write-Host ""

          # Enable Microsoft RDP rules
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Create explicit rule
          $Rule = Get-NetFirewallRule `
            -DisplayName "GitHub Actions RDP 3389" `
            -ErrorAction SilentlyContinue

          if (-not $Rule) {

              Write-Host "Creating TCP 3389 firewall rule..."

              New-NetFirewallRule `
                -DisplayName "GitHub Actions RDP 3389" `
                -Direction Inbound `
                -Protocol TCP `
                -LocalPort 3389 `
                -Action Allow `
                -Profile Any `
                -Enabled True
          }
          else {

              Write-Host "Existing TCP 3389 rule found."

              Set-NetFirewallRule `
                -DisplayName "GitHub Actions RDP 3389" `
                -Enabled True `
                -Action Allow `
                -Profile Any
          }

          Write-Host ""
          Write-Host "RDP firewall rules:"
          Get-NetFirewallRule |
            Where-Object {
              $_.DisplayName -like "*Remote Desktop*" -or
              $_.DisplayName -eq "GitHub Actions RDP 3389"
            } |
            Select-Object DisplayName, Enabled, Direction, Action

      # =========================================================
      # VERIFY RDP LISTENER
      # =========================================================

      - name: Verify RDP Listener
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING RDP LISTENER"
          Write-Host "=============================================="
          Write-Host ""

          Start-Sleep -Seconds 5

          $Listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $Listener) {

              Write-Host "ERROR: TCP 3389 is not listening."

              Write-Host ""
              Write-Host "TermService:"
              Get-Service TermService

              Write-Host ""
              Write-Host "Terminal Server configuration:"
              Get-ItemProperty `
                "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"

              Write-Host ""
              Write-Host "RDP-Tcp configuration:"
              Get-ItemProperty `
                "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

              throw "RDP listener was not detected on TCP 3389."
          }

          Write-Host "RDP listener detected:"
          $Listener |
            Select-Object LocalAddress, LocalPort, State, OwningProcess

          Write-Host ""
          Write-Host "Testing local TCP 3389..."

          $LocalTest = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "Local TcpTestSucceeded: $($LocalTest.TcpTestSucceeded)"

          if (-not $LocalTest.TcpTestSucceeded) {
              throw "Local TCP 3389 test failed."
          }

          Write-Host ""
          Write-Host "LOCAL RDP TEST: SUCCESS"

      # =========================================================
      # TAILSCALE
      # =========================================================

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal

      # =========================================================
      # GET TAILSCALE IP
      # =========================================================

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE INFORMATION"
          Write-Host "=============================================="
          Write-Host ""

          Start-Sleep -Seconds 3

          Write-Host "Tailscale status:"
          tailscale status

          Write-Host ""

          $TAILSCALE_IP = (
              tailscale ip -4 |
              Select-Object -First 1
          ).Trim()

          if (-not $TAILSCALE_IP) {
              throw "Unable to obtain Tailscale IPv4 address."
          }

          if ($TAILSCALE_IP -notmatch '^100\.') {
              throw "Unexpected Tailscale IPv4 address: $TAILSCALE_IP"
          }

          Write-Host "Tailscale IPv4: $TAILSCALE_IP"

          "TAILSCALE_IP=$TAILSCALE_IP" >> $env:GITHUB_ENV

      # =========================================================
      # TEST TAILSCALE CONNECTION
      # =========================================================

      - name: Test RDP Through Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TESTING RDP THROUGH TAILSCALE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "Tailscale ping:"

          tailscale ping $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "Testing TCP 3389..."

          $Test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host ""
          Write-Host "RemoteAddress: $($Test.RemoteAddress)"
          Write-Host "SourceAddress: $($Test.SourceAddress)"
          Write-Host "InterfaceAlias: $($Test.InterfaceAlias)"
          Write-Host "PingSucceeded: $($Test.PingSucceeded)"
          Write-Host "TcpTestSucceeded: $($Test.TcpTestSucceeded)"
          Write-Host ""

          if (-not $Test.TcpTestSucceeded) {

              Write-Host "=============================================="
              Write-Host " TCP 3389 TEST FAILED"
              Write-Host "=============================================="
              Write-Host ""

              Write-Host "Local listener:"
              Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              Write-Host ""
              Write-Host "Tailscale status:"
              tailscale status

              throw "TCP 3389 is NOT reachable through Tailscale."
          }

          Write-Host "=============================================="
          Write-Host " TAILSCALE RDP TEST: SUCCESS"
          Write-Host "=============================================="

      # =========================================================
      # OPTIONAL CHROME
      # =========================================================

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        continue-on-error: true
        shell: powershell
        run: |
          $ChromePaths = @(
            "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $ChromeInstalled = $false

          foreach ($Path in $ChromePaths) {

              if ($Path -and (Test-Path $Path)) {

                  Write-Host "Chrome already installed:"
                  Write-Host $Path

                  $ChromeInstalled = $true
                  break
              }
          }

          if (-not $ChromeInstalled) {

              Write-Host "Installing Google Chrome..."

              winget install `
                --id Google.Chrome `
                --source winget `
                --accept-source-agreements `
                --accept-package-agreements `
                --silent
          }

      # =========================================================
      # OPTIONAL FIREFOX
      # =========================================================

      - name: Install Firefox
        if: ${{ inputs.install_firefox }}
        continue-on-error: true
        shell: powershell
        run: |
          $FirefoxPaths = @(
            "${env:ProgramFiles}\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          )

          $FirefoxInstalled = $false

          foreach ($Path in $FirefoxPaths) {

              if ($Path -and (Test-Path $Path)) {

                  Write-Host "Firefox already installed:"
                  Write-Host $Path

                  $FirefoxInstalled = $true
                  break
              }
          }

          if (-not $FirefoxInstalled) {

              Write-Host "Installing Mozilla Firefox..."

              winget install `
                --id Mozilla.Firefox `
                --source winget `
                --accept-source-agreements `
                --accept-package-agreements `
                --silent
          }

      # =========================================================
      # FINAL HEALTH CHECK
      # =========================================================

      - name: Final RDP Health Check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FINAL RDP HEALTH CHECK"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "RDP service:"
          Get-Service TermService |
            Select-Object Name, Status, StartType

          Write-Host ""
          Write-Host "RDP listener:"
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen |
            Select-Object LocalAddress, LocalPort, State, OwningProcess

          Write-Host ""
          Write-Host "Tailscale:"
          tailscale status

          Write-Host ""
          Write-Host "Final TCP test:"

          $FinalTest = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "TcpTestSucceeded: $($FinalTest.TcpTestSucceeded)"

          if (-not $FinalTest.TcpTestSucceeded) {
              throw "Final RDP TCP test failed."
          }

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP CONNECTION DETAILS"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Computer: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "Port: 3389"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP IS READY"
          Write-Host "=============================================="

      # =========================================================
      # KEEP RUNNER ALIVE
      # =========================================================

      - name: Keep RDP Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP SESSION ACTIVE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Computer: $env:COMPUTERNAME"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""

          Write-Host "The runner will remain alive for approximately 350 minutes."
          Write-Host ""

          $EndTime = (Get-Date).AddMinutes(350)

          while ((Get-Date) -lt $EndTime) {

              $Remaining = $EndTime - (Get-Date)

              Write-Host "RDP ACTIVE - Time remaining: $($Remaining.Hours)h $($Remaining.Minutes)m"

              Start-Sleep -Seconds 60
          }
