
name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication"
        required: false
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: false
        default: false
        type: boolean

      install_firefox:
        description: "Install Mozilla Firefox"
        required: false
        default: false
        type: boolean

jobs:
  secure-rdp:
    name: Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDP
      RDP_PASSWORD: "2522"

    steps:

      # ============================================================
      # BASIC SYSTEM INFORMATION
      # ============================================================

      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " WINDOWS RDP RUNNER"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Computer Name:"
          Write-Host $env:COMPUTERNAME
          Write-Host ""
          Write-Host "Windows Version:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-List
          Write-Host ""

      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: Create RDP user
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=============================================="

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -ne $existingUser) {
            Write-Host "User '$username' already exists."
            Write-Host "Updating password..."

            Set-LocalUser `
              -Name $username `
              -Password $securePassword

            Enable-LocalUser -Name $username
          }
          else {
            Write-Host "Creating user '$username'..."

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "GitHub Actions RDP User"
          }

          Write-Host ""
          Write-Host "Adding user to Administrators..."

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Adding user to Remote Desktop Users..."

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP account configured."
          Write-Host "Username: $username"
          Write-Host "Password: $password"

      # ============================================================
      # ENABLE REMOTE DESKTOP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="

          # Enable Remote Desktop connections
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Type DWord `
            -Value 0

          # Make sure the Remote Desktop service starts automatically
          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          # Start Remote Desktop service
          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          # Allow Remote Desktop through Windows Firewall
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Remote Desktop has been enabled."

      # ============================================================
      # CONFIGURE NLA
      # ============================================================

      - name: Configure Network Level Authentication
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " CONFIGURING NLA"
          Write-Host "=============================================="

          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          if ("${{ inputs.disable_nla }}" -eq "true") {
            Write-Host "NLA: DISABLED"

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 0

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "SecurityLayer" `
              -Type DWord `
              -Value 0
          }
          else {
            Write-Host "NLA: ENABLED"

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 1

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "SecurityLayer" `
              -Type DWord `
              -Value 1
          }

          Write-Host ""
          Write-Host "NLA configuration complete."

      # ============================================================
      # RESTART RDP SERVICE
      # ============================================================

      - name: Restart Remote Desktop service
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Restarting Remote Desktop service..."

          Restart-Service `
            -Name "TermService" `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "TermService"

          Write-Host ""
          Write-Host "TermService status: $($service.Status)"
          Write-Host "TermService startup: $($service.StartType)"

      # ============================================================
      # VERIFY RDP LISTENER
      # ============================================================

      - name: Verify RDP listener
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " VERIFYING RDP LISTENER"
          Write-Host "=============================================="

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            Write-Host ""
            Write-Host "ERROR: Nothing is listening on TCP port 3389."
            Write-Host ""

            Write-Host "Remote Desktop service:"
            Get-Service -Name "TermService" | Format-List *

            Write-Host ""
            Write-Host "Port 3389:"
            Get-NetTCPConnection `
              -LocalPort 3389 `
              -ErrorAction SilentlyContinue

            exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS: RDP is listening on TCP port 3389."
          Write-Host ""

          $listener |
            Select-Object LocalAddress, LocalPort, State, OwningProcess |
            Format-Table -AutoSize

      # ============================================================
      # WINDOWS FIREWALL VERIFICATION
      # ============================================================

      - name: Verify Windows Firewall
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " FIREWALL CHECK"
          Write-Host "=============================================="

          $rules = Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          if ($null -eq $rules) {
            Write-Warning "Remote Desktop firewall rules were not found."
          }
          else {
            $rules |
              Select-Object DisplayName, Enabled, Direction, Action |
              Format-Table -AutoSize
          }

          Write-Host ""
          Write-Host "Testing local TCP 3389..."

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host ""
          Write-Host "Local TCP 3389:"
          Write-Host "TcpTestSucceeded = $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
            Write-Error "Local TCP port 3389 is not reachable."
            exit 1
          }

      # ============================================================
      # CONNECT TO TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal

      # ============================================================
      # GET TAILSCALE IP
      # ============================================================

      - name: Get Tailscale IP
        id: tailscale-ip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " TAILSCALE INFORMATION"
          Write-Host "=============================================="

          Start-Sleep -Seconds 3

          $ip = tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Error "Could not obtain Tailscale IPv4 address."
            exit 1
          }

          $ip = $ip.Trim()

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host $ip
          Write-Host ""

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          "ip=$ip" >> $env:GITHUB_OUTPUT

      # ============================================================
      # VERIFY TAILSCALE STATUS
      # ============================================================

      - name: Verify Tailscale
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " TAILSCALE STATUS"
          Write-Host "=============================================="

          tailscale status

          Write-Host ""
          Write-Host "Local Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "Testing Tailscale IP..."

          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host ""
          Write-Host "Tailscale TCP 3389 test:"
          Write-Host "TcpTestSucceeded = $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
            Write-Warning "Tailscale TCP 3389 test failed."
            Write-Warning "The RDP listener exists, but Tailscale TCP connectivity is not confirmed yet."
          }

      # ============================================================
      # FINAL RDP CHECK
      # ============================================================

      - name: Final RDP configuration check
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP CONNECTION INFORMATION"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "RDP Host:"
          Write-Host "$env:TAILSCALE_IP:3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host $env:RDP_USERNAME

          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:RDP_PASSWORD

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " IMPORTANT"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Use the Tailscale IP above in Windows Remote Desktop."
          Write-Host ""
          Write-Host "Example:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Username: $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""

          Write-Host "RDP listener:"
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen |
            Select-Object LocalAddress, LocalPort, State |
            Format-Table -AutoSize

      # ============================================================
      # OPTIONAL GOOGLE CHROME
      # ============================================================

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=============================================="
          Write-Host " GOOGLE CHROME"
          Write-Host "=============================================="

          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $chromeInstalled = $false

          foreach ($path in $chromePaths) {
            if (Test-Path $path) {
              Write-Host "Chrome is already installed:"
              Write-Host $path
              $chromeInstalled = $true
              break
            }
          }

          if (-not $chromeInstalled) {
            Write-Host "Chrome not found."
            Write-Host "Installing from the winget source..."

            winget install `
              --id Google.Chrome `
              --exact `
              --source winget `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Chrome installation failed."
              Write-Warning "RDP will continue running."
            }
            else {
              Write-Host "Chrome installation completed."
            }
          }

      # ============================================================
      # OPTIONAL FIREFOX
      # ============================================================

      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=============================================="
          Write-Host " MOZILLA FIREFOX"
          Write-Host "=============================================="

          $firefoxPaths = @(
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe",
            "$env:LOCALAPPDATA\Mozilla Firefox\firefox.exe"
          )

          $firefoxInstalled = $false

          foreach ($path in $firefoxPaths) {
            if (Test-Path $path) {
              Write-Host "Firefox is already installed:"
              Write-Host $path
              $firefoxInstalled = $true
              break
            }
          }

          if (-not $firefoxInstalled) {
            Write-Host "Firefox not found."
            Write-Host "Installing from the winget source..."

            winget install `
              --id Mozilla.Firefox `
              --exact `
              --source winget `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Firefox installation failed."
              Write-Warning "RDP will continue running."
            }
            else {
              Write-Host "Firefox installation completed."
            }
          }

      # ============================================================
      # FINAL HEALTH CHECK
      # ============================================================

      - name: Final health check
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FINAL HEALTH CHECK"
          Write-Host "=============================================="
          Write-Host ""

          $service = Get-Service -Name "TermService"

          Write-Host "Remote Desktop Service: $($service.Status)"

          if ($service.Status -ne "Running") {
            Write-Error "Remote Desktop service is not running."
            exit 1
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            Write-Error "RDP is no longer listening on TCP 3389."
            exit 1
          }

          Write-Host "TCP 3389: LISTENING"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "RDP is ready."
          Write-Host ""

      # ============================================================
      # KEEP RDP ALIVE
      # ============================================================

      - name: Keep RDP alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP SESSION IS READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "User    : $env:RDP_USERNAME"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Keep this GitHub Actions job running while"
          Write-Host "you are using the RDP connection."
          Write-Host ""
          Write-Host "The maximum workflow runtime is 6 hours."
          Write-Host ""

          $endTime = (Get-Date).AddMinutes(350)

          while ((Get-Date) -lt $endTime) {
            $remaining = $endTime - (Get-Date)

            Write-Host (
              "[{0}] RDP alive - {1} remaining" -f `
              (Get-Date -Format "HH:mm:ss"), `
              $remaining.ToString("hh\:mm\:ss")
            )

            Start-Sleep -Seconds 60

            # Keep the RDP service alive
            $service = Get-Service -Name "TermService"

            if ($service.Status -ne "Running") {
              Write-Warning "TermService stopped. Attempting restart..."
              Start-Service -Name "TermService" -ErrorAction SilentlyContinue
            }

            # Keep checking the listener
            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($null -eq $listener) {
              Write-Warning "TCP 3389 is no longer listening."
              Write-Warning "Attempting to restart Remote Desktop..."

              Restart-Service `
                -Name "TermService" `
                -Force `
                -ErrorAction SilentlyContinue
            }
          }

          Write-Host ""
          Write-Host "RDP keepalive period completed."

      # ============================================================
      # CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CLEANUP"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Stopping Tailscale..."

          tailscale logout `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Cleanup complete."
