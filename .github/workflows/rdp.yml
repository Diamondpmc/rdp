name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication"
        required: true
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: true
        default: false
        type: boolean

      install_firefox:
        description: "Install Mozilla Firefox"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  secure-rdp:
    name: Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Check Tailscale secret
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTH_KEY }}")) {
            Write-Error "TAILSCALE_AUTH_KEY is missing."
            exit 1
          }

          Write-Host "Tailscale secret is configured."

      - name: Show system information
        shell: powershell
        run: |
          Write-Host "Computer:"
          hostname

          Write-Host ""
          Write-Host "User:"
          whoami

          Write-Host ""
          Write-Host "Windows:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber |
            Format-List

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tsPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path $tsPath `
            -Name "fDenyTSConnections" `
            -Type DWord `
            -Value 0

          Set-ItemProperty `
            -Path $rdpPath `
            -Name "PortNumber" `
            -Type DWord `
            -Value 3389

          Set-ItemProperty `
            -Path $rdpPath `
            -Name "SecurityLayer" `
            -Type DWord `
            -Value 1

          if ("${{ inputs.disable_nla }}" -eq "true") {
            Write-Host "Disabling NLA..."

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 0
          }
          else {
            Write-Host "Keeping NLA enabled..."

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 1
          }

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Write-Host "Remote Desktop configuration complete."

      - name: Create RDP account
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "rdpuser"

          $characters = `
            "ABCDEFGHJKLMNPQRSTUVWXYZ" +
            "abcdefghijkmnopqrstuvwxyz" +
            "23456789" +
            "!@#$%^&*_-+="

          $rng = [System.Security.Cryptography.RandomNumberGenerator]::Create()

          $bytes = New-Object byte[] 32

          $rng.GetBytes($bytes)

          $passwordChars = New-Object System.Collections.Generic.List[char]

          foreach ($byte in $bytes) {
            $passwordChars.Add(
              $characters[$byte % $characters.Length]
            )
          }

          $passwordChars[0] = "A"
          $passwordChars[1] = "a"
          $passwordChars[2] = "7"
          $passwordChars[3] = "!"

          $password = -join $passwordChars

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
            Remove-LocalUser `
              -Name $username `
              -ErrorAction SilentlyContinue
          }

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "RDP User" `
            -Description "Temporary GitHub Actions RDP account" `
            -PasswordNeverExpires `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          Enable-LocalUser `
            -Name $username

          $credentialFile = Join-Path `
            $env:RUNNER_TEMP `
            "rdp-credentials.txt"

          "Username: .\rdpuser" |
            Out-File `
              -FilePath $credentialFile `
              -Encoding UTF8 `
              -Force

          "Password: $password" |
            Out-File `
              -FilePath $credentialFile `
              -Encoding UTF8 `
              -Append

          Write-Output "::add-mask::$password"

          Write-Host "RDP account created."
          Write-Host "Username: .\rdpuser"

      - name: Configure RDP firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring firewall..."

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Set-NetFirewallRule `
              -Enabled True `
              -Profile Any

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -ErrorAction SilentlyContinue

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol UDP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Write-Host "Firewall configured."

      - name: Start RDP service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {
            Start-Service `
              -Name "TermService"
          }

          Start-Sleep -Seconds 8

          $service = Get-Service `
            -Name "TermService"

          Write-Host "TermService: $($service.Status)"

          if ($service.Status -ne "Running") {
            Write-Error "TermService failed to start."
            exit 1
          }

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ip = $null

          for ($i = 1; $i -le 30; $i++) {

            $addresses = @(tailscale ip -4 2>$null)

            foreach ($address in $addresses) {

              $address = $address.Trim()

              if ($address -match "^100\.\d+\.\d+\.\d+$") {
                $ip = $address
                break
              }
            }

            if ($ip) {
              break
            }

            Write-Host "Waiting for Tailscale IP... $i/30"

            Start-Sleep -Seconds 2
          }

          if (-not $ip) {
            Write-Error "Could not obtain Tailscale IPv4 address."
            tailscale status
            exit 1
          }

          Write-Host ""
          Write-Host "Tailscale IP: $ip"

          "TAILSCALE_IP=$ip" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding UTF8 `
              -Append

      - name: Verify Tailscale
        shell: powershell
        run: |
          Write-Host "Tailscale status:"
          tailscale status

          Write-Host ""
          Write-Host "Tailscale IP:"
          tailscale ip -4

      - name: Restart RDP service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 8

          $service = Get-Service `
            -Name "TermService"

          if ($service.Status -ne "Running") {
            Write-Error "TermService is not running."
            exit 1
          }

          Write-Host "TermService is running."

      - name: Verify RDP listener
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking TCP 3389..."

          cmd /c "netstat -ano | findstr :3389"

          Write-Host ""
          Write-Host "Checking RDP listener..."

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            Write-Error "RDP is not listening on TCP 3389."
            exit 1
          }

          Write-Host ""
          Write-Host "RDP listener is active."

          $listener |
            Select-Object LocalAddress, LocalPort, State, OwningProcess |
            Format-Table -AutoSize

      - name: Test local RDP port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -InformationLevel Detailed

          $result | Format-List

          if (-not $result.TcpTestSucceeded) {
            Write-Error "Local TCP 3389 test failed."
            exit 1
          }

          Write-Host "Local RDP test passed."

      - name: Test Tailscale RDP
        shell: powershell
        run: |
          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -InformationLevel Detailed

          $result | Format-List

          if ($result.TcpTestSucceeded) {
            Write-Host "Tailscale RDP test passed."
          }
          else {
            Write-Warning "The runner could not connect to its own Tailscale IP on TCP 3389."
            Write-Warning "Continuing because external Tailscale connectivity may still work."
          }

      - name: Show RDP connection information
        shell: powershell
        run: |
          $credentialFile = Join-Path `
            $env:RUNNER_TEMP `
            "rdp-credentials.txt"

          $credentials = Get-Content `
            -Path $credentialFile `
            -Raw

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    RDP IS READY"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "RDP ADDRESS:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "USERNAME:"
          Write-Host ".\rdpuser"

          Write-Host ""
          Write-Host "CREDENTIALS:"
          Write-Host $credentials

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "USE WINDOWS REMOTE DESKTOP"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Run:"
          Write-Host "mstsc.exe"
          Write-Host ""
          Write-Host "Computer:"
          Write-Host "$env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "Username:"
          Write-Host ".\rdpuser"
          Write-Host ""
          Write-Host "============================================================"

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "Checking for Chrome..."

          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $installed = $false

          foreach ($path in $chromePaths) {

            if (Test-Path $path) {
              Write-Host "Chrome already installed:"
              Write-Host $path
              $installed = $true
              break
            }
          }

          if (-not $installed) {

            Write-Host "Installing Chrome from winget source..."

            winget install `
              --id Google.Chrome `
              --exact `
              --source winget `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Chrome installation failed."
              Write-Warning "RDP will continue running."
            }
          }

      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        continue-on-error: true
        shell: powershell
        run: |
          Write-Host "Checking for Firefox..."

          $firefoxPaths = @(
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          )

          $installed = $false

          foreach ($path in $firefoxPaths) {

            if (Test-Path $path) {
              Write-Host "Firefox already installed:"
              Write-Host $path
              $installed = $true
              break
            }
          }

          if (-not $installed) {

            Write-Host "Installing Firefox..."

            winget install `
              --id Mozilla.Firefox `
              --exact `
              --source winget `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Firefox installation failed."
              Write-Warning "RDP will continue running."
            }
          }

      - name: Final RDP check
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    FINAL CHECK"
          Write-Host "============================================================"

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "TermService:"
          Get-Service `
            -Name "TermService" |
            Select-Object Name, Status, StartType |
            Format-List

          Write-Host ""
          Write-Host "RDP listener:"
          Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Select-Object LocalAddress, LocalPort, State, OwningProcess |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "RDP ADDRESS:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "============================================================"

      - name: Keep RDP alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP SESSION ACTIVE"
          Write-Host "============================================================"
          Write-Host ""

          $endTime = (Get-Date).AddMinutes(350)

          while ((Get-Date) -lt $endTime) {

            $remaining = $endTime - (Get-Date)

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "Health check: $(Get-Date)"
            Write-Host "RDP IP: $env:TAILSCALE_IP"
            Write-Host "Remaining: $($remaining.Hours)h $($remaining.Minutes)m"
            Write-Host "============================================================"

            try {
              tailscale status
            }
            catch {
              Write-Warning "Tailscale status check failed."
            }

            $termService = Get-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

            if ($termService) {

              Write-Host "TermService: $($termService.Status)"

              if ($termService.Status -ne "Running") {

                Write-Warning "TermService stopped. Restarting..."

                try {
                  Start-Service `
                    -Name "TermService"

                  Start-Sleep -Seconds 8
                }
                catch {
                  Write-Warning "Could not restart TermService."
                }
              }
            }

            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              Write-Host "RDP 3389: LISTENING"
            }
            else {

              Write-Warning "RDP 3389 is not listening."

              try {

                Restart-Service `
                  -Name "TermService" `
                  -Force

                Start-Sleep -Seconds 8

              }
              catch {

                Write-Warning "Could not restart RDP service."
              }
            }

            Start-Sleep -Seconds 300
          }

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Cleaning up..."

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -ErrorAction SilentlyContinue

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -ErrorAction SilentlyContinue

          if (Get-LocalUser `
            -Name "rdpuser" `
            -ErrorAction SilentlyContinue) {

            Remove-LocalUser `
              -Name "rdpuser" `
              -ErrorAction SilentlyContinue
          }

          $credentialFile = Join-Path `
            $env:RUNNER_TEMP `
            "rdp-credentials.txt"

          if (Test-Path $credentialFile) {

            Remove-Item `
              -Path $credentialFile `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Cleanup complete."
