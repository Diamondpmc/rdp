name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication (use only if needed)"
        required: true
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: true
        default: false
        type: boolean

      install_firefox:
        description: "Install Mozilla Firefox"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  secure-rdp:
    name: Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECK TAILSCALE SECRET
      # ============================================================
      - name: Check Tailscale secret
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTH_KEY }}")) {
            Write-Error "TAILSCALE_AUTH_KEY is missing from GitHub Secrets."
            exit 1
          }

          Write-Host "TAILSCALE_AUTH_KEY is configured."

      # ============================================================
      # 2. INITIAL WINDOWS INFORMATION
      # ============================================================
      - name: Show Windows information
        shell: powershell
        run: |
          Write-Host "Computer name:"
          hostname

          Write-Host ""
          Write-Host "Windows version:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber |
            Format-List

      # ============================================================
      # 3. CONFIGURE WINDOWS REMOTE DESKTOP
      # ============================================================
      - name: Configure Windows Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Type DWord `
            -Value 0

          # Make sure RDP is using the standard port 3389
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          Set-ItemProperty `
            -Path $rdpPath `
            -Name "PortNumber" `
            -Type DWord `
            -Value 3389

          # Configure RDP security layer
          # 1 = RDP Security Layer
          Set-ItemProperty `
            -Path $rdpPath `
            -Name "SecurityLayer" `
            -Type DWord `
            -Value 1

          # Configure NLA
          if ("${{ inputs.disable_nla }}" -eq "true") {
            Write-Host "NLA will be DISABLED."

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 0
          }
          else {
            Write-Host "NLA will remain ENABLED."

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 1
          }

          # Make sure Remote Desktop Services starts automatically
          Set-Service -Name TermService -StartupType Automatic

          Write-Host ""
          Write-Host "RDP registry configuration:"
          Get-ItemProperty -Path $rdpPath |
            Select-Object PortNumber, SecurityLayer, UserAuthentication |
            Format-List

      # ============================================================
      # 4. CREATE RDP USER
      # ============================================================
      - name: Create RDP user
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "rdpuser"

          # Generate a strong random password
          $chars = (
            "ABCDEFGHJKLMNPQRSTUVWXYZ" +
            "abcdefghijkmnopqrstuvwxyz" +
            "23456789" +
            "!@#$%^&*_-+="
          )

          $random = [System.Security.Cryptography.RandomNumberGenerator]::Create()
          $bytes = New-Object byte[] 24
          $random.GetBytes($bytes)

          $passwordChars = New-Object System.Collections.Generic.List[char]

          foreach ($byte in $bytes) {
            $passwordChars.Add($chars[$byte % $chars.Length])
          }

          # Ensure complexity
          $passwordChars[0] = "A"
          $passwordChars[1] = "a"
          $passwordChars[2] = "7"
          $passwordChars[3] = "!"

          $password = -join $passwordChars

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove old user if present
          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
            Write-Host "Removing previous rdpuser..."
            Remove-LocalUser -Name $username
          }

          # Create new user
          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -FullName "RDP User" `
            -Description "Temporary GitHub Actions RDP account" `
            -PasswordNeverExpires:$true `
            -AccountNeverExpires:$true

          # Add ONLY to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          # Also make sure the account is enabled
          Enable-LocalUser -Name $username

          # Save credentials inside runner temporarily
          $credFile = Join-Path $env:RUNNER_TEMP "rdp-credentials.txt"

          @"
          Username: .\rdpuser
          Password: $password
          "@ | Out-File `
            -FilePath $credFile `
            -Encoding UTF8 `
            -Force

          # Mask password in GitHub Actions logs
          Write-Output "::add-mask::$password"

          Write-Host "RDP user created successfully."
          Write-Host "Username: .\rdpuser"

      # ============================================================
      # 5. CONFIGURE WINDOWS FIREWALL
      # ============================================================
      - name: Configure Windows Firewall for Tailscale RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring Windows Firewall..."

          # Enable Microsoft Remote Desktop firewall rules
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Set-NetFirewallRule -Enabled True -Profile Any

          # Remove our old custom rules if they exist
          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -ErrorAction SilentlyContinue

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -ErrorAction SilentlyContinue

          # Explicit TCP rule for Tailscale IPv4
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          # Explicit UDP rule for Tailscale IPv4
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol UDP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          # Also create a broad TCP rule as a fallback.
          # It is restricted to the Tailscale address range.
          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Fallback" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Fallback" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Write-Host ""
          Write-Host "Relevant firewall rules:"
          Get-NetFirewallRule |
            Where-Object {
              $_.DisplayName -like "*RDP*" -or
              $_.DisplayName -like "*Remote Desktop*"
            } |
            Select-Object DisplayName, Enabled, Direction, Action |
            Format-Table -AutoSize

      # ============================================================
      # 6. START / RESTART RDP SERVICE
      # ============================================================
      - name: Start Remote Desktop Services
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Configuring TermService..."

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          $service = Get-Service -Name TermService

          if ($service.Status -eq "Running") {
            Write-Host "TermService is already running."
          }
          else {
            Write-Host "Starting TermService..."
            Start-Service -Name TermService
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Get-Service -Name TermService |
            Select-Object Name, Status, StartType |
            Format-List

      # ============================================================
      # 7. CONNECT TO TAILSCALE
      # ============================================================
      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal

      # ============================================================
      # 8. WAIT FOR TAILSCALE
      # ============================================================
      - name: Get Tailscale IP
        id: ts-ip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Waiting for Tailscale IPv4 address..."

          $ip = $null

          for ($i = 1; $i -le 30; $i++) {

            $addresses = @(tailscale ip -4 2>$null)

            foreach ($candidate in $addresses) {
              if ($candidate -match '^100\.\d+\.\d+\.\d+$') {
                $ip = $candidate.Trim()
                break
              }
            }

            if ($ip) {
              break
            }

            Write-Host "Waiting... attempt $i/30"
            Start-Sleep -Seconds 2
          }

          if (-not $ip) {
            Write-Error "Could not obtain a Tailscale IPv4 address."
            tailscale status
            exit 1
          }

          Write-Host "Tailscale IPv4: $ip"

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

      # ============================================================
      # 9. TAILSCALE DIAGNOSTICS
      # ============================================================
      - name: Tailscale diagnostics
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "TAILSCALE STATUS"
          Write-Host "=============================="

          tailscale status

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TAILSCALE IP"
          Write-Host "=============================="

          tailscale ip -4

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TAILSCALE NETCHECK"
          Write-Host "=============================="

          tailscale netcheck

      # ============================================================
      # 10. RESTART RDP AFTER TAILSCALE IS UP
      # ============================================================
      - name: Restart RDP after Tailscale connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Restarting Remote Desktop Services..."

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 5

          Get-Service TermService |
            Select-Object Name, Status, StartType |
            Format-List

      # ============================================================
      # 11. VERIFY RDP REGISTRY
      # ============================================================
      - name: Verify RDP configuration
        shell: powershell
        run: |
          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          Write-Host "RDP configuration:"
          Get-ItemProperty -Path $rdpPath |
            Select-Object `
              PortNumber,
              SecurityLayer,
              UserAuthentication |
            Format-List

          $deny = Get-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections

          Write-Host "fDenyTSConnections = $($deny.fDenyTSConnections)"

      # ============================================================
      # 12. VERIFY RDP LISTENER
      # ============================================================
      - name: Verify RDP listener
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "NETSTAT"
          Write-Host "=============================="

          cmd /c "netstat -ano | findstr :3389"

          Write-Host ""
          Write-Host "=============================="
          Write-Host "QWINSTA"
          Write-Host "=============================="

          cmd /c "qwinsta"

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TCP CONNECTION"
          Write-Host "=============================="

          Get-NetTCPConnection `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue |
            Select-Object `
              LocalAddress,
              LocalPort,
              RemoteAddress,
              RemotePort,
              State,
              OwningProcess |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "=============================="
          Write-Host "TERMSERVICE PROCESS"
          Write-Host "=============================="

          Get-CimInstance Win32_Service `
            -Filter "Name='TermService'" |
            Select-Object Name, State, StartMode, ProcessId |
            Format-List

      # ============================================================
      # 13. VERIFY FIREWALL
      # ============================================================
      - name: Verify firewall
        shell: powershell
        run: |
          Write-Host "=============================="
          Write-Host "CUSTOM TAILSCALE RDP RULES"
          Write-Host "=============================="

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -ErrorAction SilentlyContinue |
            Format-List

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -ErrorAction SilentlyContinue |
            Format-List

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Fallback" `
            -ErrorAction SilentlyContinue |
            Format-List

          Write-Host ""
          Write-Host "=============================="
          Write-Host "FIREWALL PORT FILTERS"
          Write-Host "=============================="

          Get-NetFirewallPortFilter |
            Where-Object {
              $_.LocalPort -contains "3389" -or
              $_.LocalPort -eq "3389"
            } |
            Format-Table -AutoSize

      # ============================================================
      # 14. TEST LOCAL RDP PORT
      # ============================================================
      - name: Test local RDP port
        shell: powershell
        run: |
          Write-Host "Testing 127.0.0.1:3389..."

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -InformationLevel Detailed

          $result | Format-List

          if (-not $result.TcpTestSucceeded) {
            Write-Error "RDP is NOT listening on local TCP port 3389."
            exit 1
          }

          Write-Host "LOCAL RDP TEST PASSED."

      # ============================================================
      # 15. TEST TAILSCALE IP LOCALLY
      # ============================================================
      - name: Test RDP through Tailscale interface
        shell: powershell
        run: |
          Write-Host "Testing $env:TAILSCALE_IP`:3389..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -InformationLevel Detailed

          $result | Format-List

          if (-not $result.TcpTestSucceeded) {
            Write-Warning "The runner cannot establish TCP 3389 to its own Tailscale IP."
            Write-Warning "Continuing so the diagnostics remain available."
          }
          else {
            Write-Host "TAILSCALE INTERFACE RDP TEST PASSED."
          }

      # ============================================================
      # 16. VERIFY RDP USER
      # ============================================================
      - name: Verify RDP user
        shell: powershell
        run: |
          Write-Host "RDP user:"
          Get-LocalUser -Name "rdpuser" |
            Select-Object Name, Enabled, PasswordExpires, UserMayChangePassword |
            Format-List

          Write-Host ""
          Write-Host "Remote Desktop Users group:"
          Get-LocalGroupMember `
            -Group "Remote Desktop Users" |
            Format-Table -AutoSize

      # ============================================================
      # 17. OPTIONAL GOOGLE CHROME
      # ============================================================
      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Installing Google Chrome..."

          winget install `
            --id Google.Chrome `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

      # ============================================================
      # 18. OPTIONAL FIREFOX
      # ============================================================
      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Installing Mozilla Firefox..."

          winget install `
            --id Mozilla.Firefox `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

      # ============================================================
      # 19. FINAL CONNECTION INFORMATION
      # ============================================================
      - name: Show RDP connection information
        shell: powershell
        run: |
          $credFile = Join-Path $env:RUNNER_TEMP "rdp-credentials.txt"

          $credentials = Get-Content `
            -Path $credFile `
            -Raw

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP CONNECTION INFORMATION"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "RDP Port:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "Username:"
          Write-Host ".\rdpuser"
          Write-Host ""
          Write-Host "Credentials:"
          Write-Host $credentials
          Write-Host ""
          Write-Host "RDP address:"
          Write-Host "$env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "IMPORTANT:"
          Write-Host "1. Make sure Tailscale is running on your own PC."
          Write-Host "2. Your PC must be connected to the same tailnet."
          Write-Host "3. Open Remote Desktop Connection (mstsc.exe)."
          Write-Host "4. Enter the Tailscale IP shown above."
          Write-Host "5. Use username .\rdpuser"
          Write-Host ""
          Write-Host "============================================================"

      # ============================================================
      # 20. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep RDP runner alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RDP SESSION IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "The GitHub runner will remain alive until the job timeout."
          Write-Host "Workflow timeout: 360 minutes."
          Write-Host ""

          $endTime = (Get-Date).AddMinutes(350)

          while ((Get-Date) -lt $endTime) {

            $remaining = $endTime - (Get-Date)

            Write-Host ""
            Write-Host "============================================================"
            Write-Host "Health check: $(Get-Date)"
            Write-Host "Remaining: $($remaining.Hours)h $($remaining.Minutes)m"
            Write-Host "Tailscale IP: $env:TAILSCALE_IP"
            Write-Host "============================================================"

            # Tailscale check
            tailscale status

            # RDP service check
            $term = Get-Service -Name TermService -ErrorAction SilentlyContinue

            if ($term) {
              Write-Host "TermService status: $($term.Status)"
            }

            # Listener check
            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              Write-Host "RDP listener: LISTENING"
            }
            else {
              Write-Warning "RDP listener is NOT currently detected."

              try {
                Restart-Service `
                  -Name TermService `
                  -Force `
                  -ErrorAction Stop

                Start-Sleep -Seconds 5
              }
              catch {
                Write-Warning "Could not restart TermService: $($_.Exception.Message)"
              }
            }

            Start-Sleep -Seconds 300
          }

      # ============================================================
      # 21. CLEANUP
      # ============================================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          Write-Host "Starting cleanup..."

          # Remove custom firewall rules
          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -ErrorAction SilentlyContinue

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -ErrorAction SilentlyContinue

          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Fallback" `
            -ErrorAction SilentlyContinue

          # Remove temporary user
          if (Get-LocalUser -Name "rdpuser" -ErrorAction SilentlyContinue) {
            Remove-LocalUser `
              -Name "rdpuser" `
              -ErrorAction SilentlyContinue
          }

          # Remove credentials file
          $credFile = Join-Path $env:RUNNER_TEMP "rdp-credentials.txt"

          if (Test-Path $credFile) {
            Remove-Item `
              -Path $credFile `
              -Force `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Cleanup complete."
