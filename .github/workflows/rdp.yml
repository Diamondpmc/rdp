name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication"
        required: true
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: true
        default: false
        type: boolean

      install_firefox:
        description: "Install Mozilla Firefox"
        required: true
        default: false
        type: boolean


jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDP
      RDP_PASSWORD: "2522Rdp!2026"

    steps:

      # ============================================================
      # 1. CREATE RDP USER
      # ============================================================

      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=============================================="
          Write-Host ""

          $Username = $env:RDP_USERNAME
          $Password = $env:RDP_PASSWORD

          Write-Host "Username: $Username"

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {

            Write-Host "User '$Username' already exists."
            Write-Host "Updating password..."

            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -PasswordNeverExpires $true

          }
          else {

            Write-Host "Creating user '$Username'..."

            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -FullName "RDP User" `
              -Description "GitHub Actions RDP User" `
              -PasswordNeverExpires `
              -AccountNeverExpires
          }

          Write-Host "Adding user to Administrators..."

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "Adding user to Remote Desktop Users..."

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP USER CREATED SUCCESSFULLY"
          Write-Host "Username: $Username"
          Write-Host ""


      # ============================================================
      # 2. ENABLE REMOTE DESKTOP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fSingleSessionPerUser" `
            -Value 0

          Write-Host "Remote Desktop registry settings enabled."


      # ============================================================
      # 3. CONFIGURE NLA
      # ============================================================

      - name: Configure Network Level Authentication
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONFIGURING NLA"
          Write-Host "=============================================="
          Write-Host ""

          $DisableNLA = "${{ inputs.disable_nla }}"

          if ($DisableNLA -eq "true") {

            Write-Host "Disabling Network Level Authentication..."

            Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "UserAuthentication" `
              -Value 0

            Write-Host "NLA disabled."

          }
          else {

            Write-Host "Keeping Network Level Authentication enabled..."

            Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "UserAuthentication" `
              -Value 1

            Write-Host "NLA enabled."
          }


      # ============================================================
      # 4. START REMOTE DESKTOP SERVICE
      # ============================================================

      - name: Start Remote Desktop Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " STARTING REMOTE DESKTOP SERVICE"
          Write-Host "=============================================="
          Write-Host ""

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $Service = Get-Service -Name "TermService"

          Write-Host "TermService status: $($Service.Status)"

          if ($Service.Status -ne "Running") {
            throw "Remote Desktop service is not running."
          }

          Write-Host "Remote Desktop service is running."


      # ============================================================
      # 5. CONFIGURE WINDOWS FIREWALL
      # ============================================================

      - name: Configure RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONFIGURING RDP FIREWALL"
          Write-Host "=============================================="
          Write-Host ""

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $ExistingRule = Get-NetFirewallRule `
            -DisplayName "Allow RDP TCP 3389" `
            -ErrorAction SilentlyContinue

          if (-not $ExistingRule) {

            New-NetFirewallRule `
              -DisplayName "Allow RDP TCP 3389" `
              -Direction Inbound `
              -Protocol TCP `
              -LocalPort 3389 `
              -Action Allow `
              -Profile Any

          }
          else {

            Set-NetFirewallRule `
              -DisplayName "Allow RDP TCP 3389" `
              -Enabled True `
              -Action Allow
          }

          Write-Host "RDP firewall rule configured."


      # ============================================================
      # 6. RESTART RDP SERVICE
      # ============================================================

      - name: Restart Remote Desktop Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Restarting Remote Desktop service..."

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 5

          $Service = Get-Service -Name "TermService"

          Write-Host "TermService status: $($Service.Status)"

          if ($Service.Status -ne "Running") {
            throw "TermService failed to start."
          }


      # ============================================================
      # 7. VERIFY LOCAL RDP PORT
      # ============================================================

      - name: Verify Local RDP Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING RDP PORT"
          Write-Host "=============================================="
          Write-Host ""

          Start-Sleep -Seconds 3

          $Listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $Listener) {
            Write-Host "No listener detected on TCP 3389."
            Write-Host ""
            Write-Host "Current TCP listeners:"
            Get-NetTCPConnection -State Listen |
              Sort-Object LocalPort |
              Format-Table -AutoSize

            throw "RDP is not listening on TCP port 3389."
          }

          Write-Host "RDP IS LISTENING ON TCP 3389."
          Write-Host ""

          $Listener |
            Format-Table LocalAddress, LocalPort, State, OwningProcess -AutoSize


      # ============================================================
      # 8. TEST LOCAL TCP CONNECTION
      # ============================================================

      - name: Test Local RDP Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Testing 127.0.0.1:3389..."

          $Test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "TcpTestSucceeded: $($Test.TcpTestSucceeded)"

          if (-not $Test.TcpTestSucceeded) {
            throw "Local TCP connection to RDP port 3389 failed."
          }

          Write-Host "LOCAL RDP TEST PASSED."


      # ============================================================
      # 9. CONNECT TO TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal


      # ============================================================
      # 10. GET TAILSCALE IP
      # ============================================================

      - name: Get Tailscale IP
        id: tailscale-ip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE INFORMATION"
          Write-Host "=============================================="
          Write-Host ""

          $TailscalePath = (Get-Command tailscale -ErrorAction Stop).Source

          Write-Host "Tailscale executable:"
          Write-Host $TailscalePath
          Write-Host ""

          $IPv4 = tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($IPv4)) {
            throw "Could not obtain Tailscale IPv4 address."
          }

          $IPv4 = $IPv4.Trim()

          Write-Host "Tailscale IPv4:"
          Write-Host $IPv4

          "TAILSCALE_IP=$IPv4" >> $env:GITHUB_ENV


      # ============================================================
      # 11. VERIFY TAILSCALE
      # ============================================================

      - name: Verify Tailscale Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING TAILSCALE"
          Write-Host "=============================================="
          Write-Host ""

          tailscale status

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP


      # ============================================================
      # 12. TEST RDP THROUGH TAILSCALE
      # ============================================================

      - name: Test RDP Through Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TESTING TAILSCALE RDP CONNECTION"
          Write-Host "=============================================="
          Write-Host ""

          $IP = $env:TAILSCALE_IP

          Write-Host "Testing:"
          Write-Host "$IP`:3389"
          Write-Host ""

          $Test = Test-NetConnection `
            -ComputerName $IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host ""
          Write-Host "RemoteAddress: $($Test.RemoteAddress)"
          Write-Host "RemotePort: $($Test.RemotePort)"
          Write-Host "TcpTestSucceeded: $($Test.TcpTestSucceeded)"
          Write-Host ""

          if (-not $Test.TcpTestSucceeded) {

            Write-Host "WARNING:"
            Write-Host "Tailscale is connected, but TCP 3389 is not reachable through the Tailscale interface."
            Write-Host ""

            Write-Host "Network interfaces:"
            Get-NetIPConfiguration |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "TCP 3389 listeners:"
            Get-NetTCPConnection `
              -LocalPort 3389 `
              -ErrorAction SilentlyContinue |
              Format-Table -AutoSize

            Write-Host ""
            Write-Host "Firewall rules:"
            Get-NetFirewallRule `
              -DisplayName "*Remote Desktop*" `
              -ErrorAction SilentlyContinue |
              Select-Object DisplayName, Enabled, Direction, Action |
              Format-Table -AutoSize

            throw "RDP is not reachable through Tailscale."
          }

          Write-Host "TAILSCALE RDP TEST PASSED."


      # ============================================================
      # 13. SHOW CONNECTION INFORMATION
      # ============================================================

      - name: Display RDP Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                  RDP READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Computer:"
          Write-Host "$env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "$env:RDP_USERNAME"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "RDP Port:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""


      # ============================================================
      # 14. OPTIONAL CHROME
      # ============================================================

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " INSTALLING GOOGLE CHROME"
          Write-Host "=============================================="
          Write-Host ""

          $ChromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $ChromeInstalled = $false

          foreach ($Path in $ChromePaths) {

            if ($Path -and (Test-Path $Path)) {

              Write-Host "Chrome already installed:"
              Write-Host $Path

              $ChromeInstalled = $true
              break
            }
          }

          if (-not $ChromeInstalled) {

            Write-Host "Chrome not found."
            Write-Host "Installing from winget repository..."

            winget install `
              --id Google.Chrome `
              --exact `
              --source winget `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Chrome installation failed with exit code $LASTEXITCODE."
              Write-Warning "Continuing because Chrome is optional."
            }
            else {
              Write-Host "Chrome installation completed."
            }
          }


      # ============================================================
      # 15. OPTIONAL FIREFOX
      # ============================================================

      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " INSTALLING MOZILLA FIREFOX"
          Write-Host "=============================================="
          Write-Host ""

          $FirefoxPaths = @(
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          )

          $FirefoxInstalled = $false

          foreach ($Path in $FirefoxPaths) {

            if ($Path -and (Test-Path $Path)) {

              Write-Host "Firefox already installed:"
              Write-Host $Path

              $FirefoxInstalled = $true
              break
            }
          }

          if (-not $FirefoxInstalled) {

            Write-Host "Firefox not found."
            Write-Host "Installing from winget repository..."

            winget install `
              --id Mozilla.Firefox `
              --exact `
              --source winget `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Firefox installation failed with exit code $LASTEXITCODE."
              Write-Warning "Continuing because Firefox is optional."
            }
            else {
              Write-Host "Firefox installation completed."
            }
          }


      # ============================================================
      # 16. FINAL HEALTH CHECK
      # ============================================================

      - name: Final RDP Health Check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FINAL HEALTH CHECK"
          Write-Host "=============================================="
          Write-Host ""

          $Service = Get-Service -Name "TermService"

          if ($Service.Status -ne "Running") {
            throw "TermService is not running."
          }

          Write-Host "TermService: RUNNING"

          $Listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $Listener) {
            throw "TCP 3389 is not listening."
          }

          Write-Host "TCP 3389: LISTENING"

          $Firewall = Get-NetFirewallRule `
            -DisplayName "Allow RDP TCP 3389" `
            -ErrorAction SilentlyContinue

          if ($Firewall) {
            Write-Host "RDP firewall rule: PRESENT"
          }

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                ALL RDP CHECKS PASSED"
          Write-Host "============================================================"
          Write-Host ""


      # ============================================================
      # 17. KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep RDP Session Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "              RDP SESSION IS ACTIVE"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Computer:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "$env:RDP_USERNAME"

          Write-Host ""
          Write-Host "Password:"
          Write-Host "$env:RDP_PASSWORD"

          Write-Host ""
          Write-Host "The GitHub runner will remain active while this job runs."
          Write-Host "Maximum workflow duration: approximately 6 hours."
          Write-Host ""

          for ($i = 1; $i -le 350; $i++) {

            Start-Sleep -Seconds 60

            $Service = Get-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

            $Listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            $TailscaleRunning = Get-Process `
              -Name "tailscaled" `
              -ErrorAction SilentlyContinue

            Write-Host "[$i/350] RDP=$($Service.Status) | Port3389=$([bool]$Listener) | Tailscale=$([bool]$TailscaleRunning)"

            if (-not $Service -or $Service.Status -ne "Running") {

              Write-Warning "TermService stopped. Attempting restart..."

              Start-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue
            }

            if (-not $Listener) {

              Write-Warning "TCP 3389 listener disappeared."

              Start-Sleep -Seconds 3
            }
          }

          Write-Host ""
          Write-Host "Keep-alive period completed."
