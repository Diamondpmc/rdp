name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication (less secure)"
        required: true
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: true
        default: false
        type: boolean

      install_firefox:
        description: "Install Mozilla Firefox"
        required: true
        default: false
        type: boolean

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      TAILSCALE_VERSION: "1.82.0"

    steps:

      # ============================================================
      # 1. ENABLE WINDOWS REMOTE DESKTOP
      # ============================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Require standard RDP security layer.
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1

          if ("${{ inputs.disable_nla }}" -eq "true") {
              Write-Host "WARNING: NLA will be disabled."

              Set-ItemProperty `
                -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
                -Name "UserAuthentication" `
                -Value 0
          }
          else {
              Write-Host "NLA will remain enabled."

              Set-ItemProperty `
                -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
                -Name "UserAuthentication" `
                -Value 1
          }

          # Start Remote Desktop service.
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          # Disable Microsoft's broad built-in RDP firewall rules.
          # We will create a Tailscale-only rule later.
          Write-Host "Disabling built-in RDP firewall rules..."

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          Write-Host "Remote Desktop configuration complete."

      # ============================================================
      # 2. CREATE NON-ADMIN RDP USER
      # ============================================================
      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"

          # Generate a strong random password.
          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"
          $special = "!@#$%^&*_-+="

          $chars = @()

          $chars += $upper[(Get-Random -Maximum $upper.Length)]
          $chars += $lower[(Get-Random -Maximum $lower.Length)]
          $chars += $numbers[(Get-Random -Maximum $numbers.Length)]
          $chars += $special[(Get-Random -Maximum $special.Length)]

          $allChars = ($upper + $lower + $numbers + $special)

          for ($i = $chars.Count; $i -lt 20; $i++) {
              $chars += $allChars[(Get-Random -Maximum $allChars.Length)]
          }

          # Shuffle the password.
          $password = -join ($chars | Sort-Object { Get-Random })

          # Mask password from GitHub Actions logs.
          Write-Output "::add-mask::$password"

          # Remove an existing RDP account if present.
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existing) {
              Write-Host "Removing existing RDP user..."
              Remove-LocalUser -Name $username
          }

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -Description "Temporary GitHub Actions RDP user" `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          # IMPORTANT:
          # RDP user is NOT made Administrator.
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          # Store username for later steps.
          "RDP_USERNAME=$username" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          # Store password temporarily outside GITHUB_ENV.
          $credentialFile = Join-Path `
            $env:RUNNER_TEMP `
            "rdp-password.txt"

          Set-Content `
            -Path $credentialFile `
            -Value $password `
            -Encoding utf8 `
            -NoNewline

          "RDP_PASSWORD_FILE=$credentialFile" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "RDP user created successfully."
          Write-Host "Username: $username"
          Write-Host "User is a member of Remote Desktop Users."
          Write-Host "User is NOT an Administrator."

      # ============================================================
      # 3. DOWNLOAD TAILSCALE
      # ============================================================
      - name: Download Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "tailscale-setup.msi"

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-$env:TAILSCALE_VERSION-amd64.msi"

          Write-Host "Downloading Tailscale..."
          Write-Host "Version: $env:TAILSCALE_VERSION"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer `
            -UseBasicParsing

          if (!(Test-Path $installer)) {
              throw "Tailscale installer was not downloaded."
          }

          Write-Host "Tailscale installer downloaded successfully."

          "TAILSCALE_INSTALLER=$installer" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ============================================================
      # 4. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$env:TAILSCALE_INSTALLER`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              throw "Tailscale installation failed with exit code $($process.ExitCode)."
          }

          Write-Host "Tailscale installed successfully."

      # ============================================================
      # 5. CONNECT TO TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY secret is missing."
          }

          Write-Host "Connecting this runner to Tailscale..."

          & "C:\Program Files\Tailscale\tailscale.exe" up `
            --auth-key="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID" `
            --accept-dns=false

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale failed to connect."
          }

          Write-Host "Tailscale connection command completed."

      # ============================================================
      # 6. GET TAILSCALE IP
      # ============================================================
      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = $null

          for ($attempt = 1; $attempt -le 60; $attempt++) {

              Write-Host "Checking Tailscale IP - attempt $attempt/60"

              try {
                  $ips = & $tailscale ip -4 2>$null

                  foreach ($candidate in $ips) {
                      $candidate = "$candidate".Trim()

                      if ($candidate -match "^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$") {
                          $ip = $candidate
                          break
                      }
                  }
              }
              catch {
                  Write-Host "Tailscale IP check failed temporarily."
              }

              if ($ip) {
                  break
              }

              Start-Sleep -Seconds 2
          }

          if (!$ip) {
              throw "Could not obtain a Tailscale IPv4 address."
          }

          Write-Host "Tailscale IPv4: $ip"

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      # ============================================================
      # 7. CREATE TAILSCALE-ONLY RDP FIREWALL RULE
      # ============================================================
      - name: Configure RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $ruleName = "RDP-Tailscale"

          # Remove an old copy if present.
          Remove-NetFirewallRule `
            -DisplayName $ruleName `
            -ErrorAction SilentlyContinue

          Write-Host "Creating Tailscale-only RDP firewall rule..."

          New-NetFirewallRule `
            -DisplayName $ruleName `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -Action Allow `
            -Profile Any `
            -RemoteAddress "100.64.0.0/10" `
            -Enabled True

          Write-Host "Firewall rule created."

      # ============================================================
      # 8. VERIFY RDP
      # ============================================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "RDP VERIFICATION"
          Write-Host "=========================================="

          # Check TermService.
          $service = Get-Service -Name TermService

          Write-Host "TermService status: $($service.Status)"

          if ($service.Status -ne "Running") {
              throw "Remote Desktop service is not running."
          }

          # Check TCP 3389.
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (!$listener) {
              throw "Nothing is listening on TCP port 3389."
          }

          Write-Host "TCP 3389 is listening."

          # Check custom firewall rule.
          $rule = Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          if (!$rule) {
              throw "RDP-Tailscale firewall rule was not found."
          }

          if ($rule.Enabled -ne "True") {
              throw "RDP-Tailscale firewall rule is not enabled."
          }

          Write-Host "RDP-Tailscale firewall rule is enabled."

          # Verify broad built-in RDP rules remain disabled.
          $builtin = Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Where-Object {
                $_.Enabled -eq "True"
            }

          if ($builtin) {
              Write-Host "WARNING: Some built-in Remote Desktop firewall rules are enabled."
          }
          else {
              Write-Host "Built-in Remote Desktop firewall rules are disabled."
          }

          # Local TCP connectivity check.
          try {
              $test = Test-NetConnection `
                -ComputerName "127.0.0.1" `
                -Port 3389 `
                -WarningAction SilentlyContinue

              if (!$test.TcpTestSucceeded) {
                  throw "Local TCP 3389 test failed."
              }

              Write-Host "Local TCP 3389 test succeeded."
          }
          catch {
              throw "RDP local connectivity test failed."
          }

          Write-Host "=========================================="
          Write-Host "RDP VERIFICATION PASSED"
          Write-Host "=========================================="

      # ============================================================
      # 9. INSTALL CHROME (OPTIONAL)
      # ============================================================
      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Google Chrome..."

          $chromeInstaller = Join-Path `
            $env:RUNNER_TEMP `
            "chrome_installer.exe"

          Invoke-WebRequest `
            -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
            -OutFile $chromeInstaller `
            -UseBasicParsing

          if (!(Test-Path $chromeInstaller)) {
              throw "Chrome installer was not downloaded."
          }

          $process = Start-Process `
            -FilePath $chromeInstaller `
            -ArgumentList "/silent", "/install" `
            -Wait `
            -PassThru

          Write-Host "Chrome installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              Write-Host "WARNING: Chrome installation returned a non-zero exit code."
          }

      # ============================================================
      # 10. INSTALL FIREFOX (OPTIONAL)
      # ============================================================
      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Mozilla Firefox..."

          $firefoxInstaller = Join-Path `
            $env:RUNNER_TEMP `
            "firefox_installer.exe"

          Invoke-WebRequest `
            -Uri "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US" `
            -OutFile $firefoxInstaller `
            -UseBasicParsing

          if (!(Test-Path $firefoxInstaller)) {
              throw "Firefox installer was not downloaded."
          }

          $process = Start-Process `
            -FilePath $firefoxInstaller `
            -ArgumentList "/S" `
            -Wait `
            -PassThru

          Write-Host "Firefox installer exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              Write-Host "WARNING: Firefox installation returned a non-zero exit code."
          }

      # ============================================================
      # 11. DISPLAY CONNECTION INFORMATION
      # ============================================================
      - name: Display RDP Connection Information
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "             RDP CONNECTION READY"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Port         : 3389"
          Write-Host ""
          Write-Host "Use this address in your RDP client:"
          Write-Host ""
          Write-Host "$env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "The RDP password is available in the GitHub"
          Write-Host "Actions Job Summary."
          Write-Host ""
          Write-Host "=================================================="

          # Write password to the GitHub Job Summary.
          if (!(Test-Path $env:RDP_PASSWORD_FILE)) {
              throw "RDP password file does not exist."
          }

          $password = Get-Content `
            -Path $env:RDP_PASSWORD_FILE `
            -Raw

          $summary = @"
          ## RDP Connection Information

          | Setting | Value |
          |---|---|
          | Tailscale IP | `$env:TAILSCALE_IP` |
          | Port | `3389` |
          | Username | `$env:RDP_USERNAME` |
          | Password | `$password` |

          ### RDP Address

          `$env:TAILSCALE_IP`:3389

          **Keep this information private.**
          "@

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value $summary

          # Do NOT print the password to the normal workflow log.
          Write-Host "Connection information added to Job Summary."

      # ============================================================
      # 12. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep RDP Session Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          Write-Host ""
          Write-Host "=================================================="
          Write-Host "RDP SERVER IS RUNNING"
          Write-Host "=================================================="
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "Port         : 3389"
          Write-Host ""
          Write-Host "The workflow will remain alive until GitHub"
          Write-Host "terminates the job."
          Write-Host ""

          while ($true) {

              $timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"

              Write-Host ""
              Write-Host "[$timestamp] Health check..."

              # RDP service.
              $service = Get-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              if ($service -and $service.Status -eq "Running") {
                  Write-Host "RDP service: OK"
              }
              else {
                  Write-Host "RDP service: NOT RUNNING"

                  try {
                      Start-Service -Name TermService -ErrorAction Stop
                      Write-Host "RDP service restarted."
                  }
                  catch {
                      Write-Host "Unable to restart RDP service."
                  }
              }

              # Port 3389.
              $listener = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  Write-Host "TCP 3389: LISTENING"
              }
              else {
                  Write-Host "TCP 3389: NOT LISTENING"
              }

              # Firewall rule.
              $rule = Get-NetFirewallRule `
                -DisplayName "RDP-Tailscale" `
                -ErrorAction SilentlyContinue

              if ($rule -and $rule.Enabled -eq "True") {
                  Write-Host "Firewall: OK"
              }
              else {
                  Write-Host "Firewall: RULE NOT ACTIVE"
              }

              # Tailscale status.
              try {
                  $status = & $tailscale status 2>&1

                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "Tailscale: CONNECTED"
                  }
                  else {
                      Write-Host "Tailscale: STATUS CHECK FAILED"
                  }
              }
              catch {
                  Write-Host "Tailscale: STATUS CHECK FAILED"
              }

              Write-Host "Next health check in 5 minutes."

              Start-Sleep -Seconds 300
          }

      # ============================================================
      # 13. CLEANUP
      # ============================================================
      - name: Cleanup
        if: ${{ always() }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Starting cleanup..."

          # Remove custom firewall rule.
          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          Write-Host "Firewall rule removed."

          # Remove RDP user.
          if ($env:RDP_USERNAME) {
              Remove-LocalUser `
                -Name $env:RDP_USERNAME `
                -ErrorAction SilentlyContinue

              Write-Host "RDP user removed."
          }

          # Remove temporary password file.
          if ($env:RDP_PASSWORD_FILE) {
              Remove-Item `
                -Path $env:RDP_PASSWORD_FILE `
                -Force `
                -ErrorAction SilentlyContinue

              Write-Host "Temporary password file removed."
          }

          # Disconnect Tailscale.
          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (Test-Path $tailscale) {
              & $tailscale logout 2>$null
              Write-Host "Tailscale logout completed."
          }

          Write-Host "Cleanup complete."
