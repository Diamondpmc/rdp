name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication"
        required: false
        type: boolean
        default: false

      install_chrome:
        description: "Install Google Chrome"
        required: false
        type: boolean
        default: false

      install_firefox:
        description: "Install Mozilla Firefox"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secure-rdp:
    name: Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CHECK SECRET
      # ============================================================

      - name: Check Tailscale secret
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.TAILSCALE_AUTH_KEY }}")) {
            Write-Error "TAILSCALE_AUTH_KEY is missing."
            exit 1
          }

          Write-Host "Tailscale authentication secret is present."

      # ============================================================
      # 2. ENABLE WINDOWS REMOTE DESKTOP
      # ============================================================

      - name: Configure Windows Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Configuring Windows Remote Desktop"
          Write-Host "========================================"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Type DWord `
            -Value 0

          # Force RDP TCP port 3389
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "PortNumber" `
            -Type DWord `
            -Value 3389

          # RDP security layer
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Type DWord `
            -Value 1

          # Configure NLA
          if ("${{ inputs.disable_nla }}" -eq "true") {
            Write-Host "NLA: DISABLED"

            Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 0
          }
          else {
            Write-Host "NLA: ENABLED"

            Set-ItemProperty `
              -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 1
          }

          # Make sure Remote Desktop Services starts automatically
          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          # Start service if necessary
          $service = Get-Service -Name "TermService"

          if ($service.Status -ne "Running") {
            Start-Service -Name "TermService"
          }

          Write-Host ""
          Write-Host "RDP registry configuration:"
          Get-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name fDenyTSConnections

          Get-ItemProperty `
            "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name PortNumber,SecurityLayer,UserAuthentication

          Write-Host ""
          Write-Host "TermService:"
          Get-Service -Name "TermService"

      # ============================================================
      # 3. CREATE RDP USER
      # ============================================================

      - name: Create RDP user
        id: credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $username = "rdpuser"

          # Generate a strong random password
          $chars = (
            "ABCDEFGHJKLMNPQRSTUVWXYZ" +
            "abcdefghijkmnopqrstuvwxyz" +
            "23456789" +
            "!@#$%^&*_-+="
          )

          $passwordChars = 1..24 | ForEach-Object {
            $chars[(Get-Random -Maximum $chars.Length)]
          }

          $password = -join $passwordChars

          # Guarantee a reasonable password mix
          $password = "Rdp!" + $password + "9#"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          # Remove old account if it exists
          $existing = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existing) {
            Write-Host "Removing existing $username account..."
            Remove-LocalUser -Name $username
          }

          # Create account
          New-LocalUser `
            -Name $username `
            -Password $securePassword `
            -Description "Temporary GitHub Actions RDP account" `
            -PasswordNeverExpires:$true `
            -AccountNeverExpires:$true

          # Add ONLY to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username

          # Make sure account is enabled
          Enable-LocalUser -Name $username

          # Mask password in GitHub logs
          Write-Output "::add-mask::$password"

          # Save credentials for later steps
          "RDP_USERNAME=$username" | Out-File `
            -FilePath "$env:RUNNER_TEMP\rdp_credentials.txt" `
            -Encoding utf8

          "RDP_PASSWORD=$password" | Out-File `
            -FilePath "$env:RUNNER_TEMP\rdp_credentials.txt" `
            -Append `
            -Encoding utf8

          Write-Host ""
          Write-Host "RDP account created successfully."
          Write-Host "Username: $username"

      # ============================================================
      # 4. FIREWALL
      # ============================================================

      - name: Configure RDP firewall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Configuring Windows Firewall"
          Write-Host "========================================"

          # Enable the standard Microsoft Remote Desktop rules
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Remove old custom rules
          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          # Tailscale IPv4 range
          $tailscaleRange = "100.64.0.0/10"

          # Explicit TCP 3389 allow rule for Tailscale
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress $tailscaleRange `
            -Profile Any

          # UDP 3389 is useful for modern RDP transport
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -Direction Inbound `
            -Action Allow `
            -Protocol UDP `
            -LocalPort 3389 `
            -RemoteAddress $tailscaleRange `
            -Profile Any

          Write-Host ""
          Write-Host "Firewall rules:"
          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP","RDP-Tailscale-UDP" |
            Format-Table `
              DisplayName,
              Enabled,
              Direction,
              Action

      # ============================================================
      # 5. CONNECT RUNNER TO TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal

      # ============================================================
      # 6. WAIT FOR TAILSCALE
      # ============================================================

      - name: Wait for Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Waiting for Tailscale"
          Write-Host "========================================"

          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
            $tailscaleExe = "tailscale.exe"
          }

          $tailscaleIP = $null

          for ($i = 1; $i -le 30; $i++) {

            try {
              $ips = & $tailscaleExe ip -4 2>$null

              foreach ($ip in $ips) {
                $ip = "$ip".Trim()

                if ($ip -match '^100\.(\d{1,3}\.){2}\d{1,3}$') {
                  $tailscaleIP = $ip
                  break
                }
              }
            }
            catch {
              Write-Host "Tailscale IP not available yet."
            }

            if ($tailscaleIP) {
              break
            }

            Write-Host "Attempt $i/30 - waiting for Tailscale IP..."
            Start-Sleep -Seconds 2
          }

          if (-not $tailscaleIP) {
            Write-Error "Could not obtain a Tailscale IPv4 address."
            exit 1
          }

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host $tailscaleIP

          "TAILSCALE_IP=$tailscaleIP" | Out-File `
            -FilePath "$env:RUNNER_TEMP\tailscale_info.txt" `
            -Encoding utf8

          "TAILSCALE_IP=$tailscaleIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "Tailscale status:"
          & $tailscaleExe status

      # ============================================================
      # 7. VERIFY TAILSCALE NETWORK
      # ============================================================

      - name: Verify Tailscale network
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscaleExe)) {
            $tailscaleExe = "tailscale.exe"
          }

          Write-Host "========================================"
          Write-Host "Tailscale diagnostics"
          Write-Host "========================================"

          Write-Host ""
          Write-Host "Tailscale IP:"
          & $tailscaleExe ip -4

          Write-Host ""
          Write-Host "Tailscale status:"
          & $tailscaleExe status

          Write-Host ""
          Write-Host "Tailscale netcheck:"
          & $tailscaleExe netcheck

      # ============================================================
      # 8. RESTART RDP SERVICE
      # ============================================================

      - name: Restart Remote Desktop Services
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Restarting Remote Desktop Services..."

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "TermService"

          if ($service.Status -ne "Running") {
            Write-Error "TermService is not running."
            exit 1
          }

          Write-Host "TermService is RUNNING."

      # ============================================================
      # 9. VERIFY RDP LISTENER
      # ============================================================

      - name: Verify RDP listener
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Checking RDP listener"
          Write-Host "========================================"

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "Port 3389:"
          cmd /c 'netstat -ano | findstr ":3389"'

          Write-Host ""
          Write-Host "TermService:"
          cmd /c 'tasklist /svc | findstr TermService'

          Write-Host ""
          Write-Host "RDP sessions:"
          cmd /c 'qwinsta'

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            Write-Error "NOTHING IS LISTENING ON TCP 3389."
            exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS: TCP 3389 is listening."

          $listener | Format-Table `
            LocalAddress,
            LocalPort,
            State,
            OwningProcess

      # ============================================================
      # 10. VERIFY FIREWALL
      # ============================================================

      - name: Verify firewall
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "Firewall verification"
          Write-Host "========================================"

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP","RDP-Tailscale-UDP" |
            Format-List `
              DisplayName,
              Enabled,
              Direction,
              Action,
              Profile

          Write-Host ""
          Write-Host "Remote Desktop firewall rules:"
          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Where-Object Enabled -eq "True" |
            Select-Object DisplayName,Enabled,Direction,Action |
            Format-Table

      # ============================================================
      # 11. TEST LOCAL RDP
      # ============================================================

      - name: Test local RDP port
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Testing local TCP 3389"
          Write-Host "========================================"

          $result = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -InformationLevel Detailed

          $result | Format-List

          if (-not $result.TcpTestSucceeded) {
            Write-Error "Local TCP 3389 test FAILED."
            exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS: Local TCP 3389 is reachable."

      # ============================================================
      # 12. TEST TAILSCALE IP RDP PORT
      # ============================================================

      - name: Test Tailscale RDP port
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Testing RDP through Tailscale interface"
          Write-Host "========================================"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -InformationLevel Detailed

          $result | Format-List

          if (-not $result.TcpTestSucceeded) {
            Write-Error "Tailscale IP TCP 3389 test FAILED."
            exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS: Tailscale IP TCP 3389 is reachable."

      # ============================================================
      # 13. OPTIONAL CHROME
      # ============================================================

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Google Chrome..."

          $installer = "$env:TEMP\chrome_installer.exe"

          Invoke-WebRequest `
            -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/silent","/install" `
            -Wait

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          Write-Host "Chrome installation finished."

      # ============================================================
      # 14. OPTIONAL FIREFOX
      # ============================================================

      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Mozilla Firefox..."

          $installer = "$env:TEMP\firefox_installer.exe"

          Invoke-WebRequest `
            -Uri "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait

          Remove-Item $installer -Force -ErrorAction SilentlyContinue

          Write-Host "Firefox installation finished."

      # ============================================================
      # 15. SHOW CONNECTION INFORMATION
      # ============================================================

      - name: RDP Connection Information
        shell: pwsh
        run: |
          $credentialsFile = "$env:RUNNER_TEMP\rdp_credentials.txt"

          $credentials = @{}

          if (Test-Path $credentialsFile) {
            Get-Content $credentialsFile | ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                $credentials[$matches[1]] = $matches[2]
              }
            }
          }

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP IS READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "COMPUTER / ADDRESS:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "PORT:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "USERNAME:"
          Write-Host "$($credentials["RDP_USERNAME"])"
          Write-Host ""
          Write-Host "PASSWORD:"
          Write-Host "$($credentials["RDP_PASSWORD"])"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "IMPORTANT:"
          Write-Host "Your own PC must also be connected to the SAME Tailscale"
          Write-Host "network before connecting with Windows Remote Desktop."
          Write-Host ""
          Write-Host "In Windows Remote Desktop (mstsc.exe), enter:"
          Write-Host ""
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "For username, use:"
          Write-Host ".\$($credentials["RDP_USERNAME"])"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "::add-mask::$($credentials["RDP_PASSWORD"])"

      # ============================================================
      # 16. KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep RDP alive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "RDP SESSION ACTIVE"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RDP Port: 3389"
          Write-Host ""
          Write-Host "The GitHub runner will remain online until the job timeout."
          Write-Host "============================================================"
          Write-Host ""

          $startTime = Get-Date
          $endTime = $startTime.AddHours(5.9)

          while ((Get-Date) -lt $endTime) {

            Write-Host ""
            Write-Host "------------------------------------------------------------"
            Write-Host "RDP health check: $(Get-Date)"
            Write-Host "------------------------------------------------------------"

            # Check TermService
            $termService = Get-Service -Name "TermService" -ErrorAction SilentlyContinue

            if ($termService) {
              Write-Host "TermService: $($termService.Status)"

              if ($termService.Status -ne "Running") {
                Write-Host "TermService stopped. Restarting..."

                try {
                  Start-Service -Name "TermService"
                  Start-Sleep -Seconds 3
                }
                catch {
                  Write-Host "Could not restart TermService: $_"
                }
              }
            }
            else {
              Write-Host "TermService service not found."
            }

            # Check port
            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($listener) {
              Write-Host "RDP TCP 3389: LISTENING"
            }
            else {
              Write-Host "RDP TCP 3389: NOT LISTENING"

              try {
                Restart-Service -Name "TermService" -Force
                Start-Sleep -Seconds 5
              }
              catch {
                Write-Host "RDP service restart failed: $_"
              }
            }

            # Check Tailscale
            $tailscaleExe = "C:\Program Files\Tailscale\tailscale.exe"

            if (Test-Path $tailscaleExe) {

              $tsIP = & $tailscaleExe ip -4 2>$null

              Write-Host "Tailscale IP: $tsIP"

              $tsStatus = & $tailscaleExe status 2>&1

              if ($LASTEXITCODE -eq 0) {
                Write-Host "Tailscale: ONLINE"
              }
              else {
                Write-Host "Tailscale status returned an error."
                Write-Host $tsStatus
              }
            }

            # Firewall check
            $fwRule = Get-NetFirewallRule `
              -DisplayName "RDP-Tailscale-TCP" `
              -ErrorAction SilentlyContinue

            if ($fwRule -and $fwRule.Enabled -eq "True") {
              Write-Host "Tailscale RDP firewall rule: ENABLED"
            }
            else {
              Write-Host "Tailscale RDP firewall rule: NOT ENABLED"
            }

            Write-Host ""
            Write-Host "Next health check in 5 minutes."

            Start-Sleep -Seconds 300
          }

          Write-Host ""
          Write-Host "Keep-alive period finished."

      # ============================================================
      # 17. CLEANUP
      # ============================================================

      - name: Cleanup
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "Cleaning up temporary RDP environment"
          Write-Host "============================================================"

          # Remove firewall rules
          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-TCP" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-UDP" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          # Remove RDP user
          $user = Get-LocalUser `
            -Name "rdpuser" `
            -ErrorAction SilentlyContinue

          if ($user) {
            Remove-LocalUser `
              -Name "rdpuser" `
              -ErrorAction SilentlyContinue

            Write-Host "Removed temporary RDP user."
          }

          # Remove credential file
          Remove-Item `
            "$env:RUNNER_TEMP\rdp_credentials.txt" `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            "$env:RUNNER_TEMP\tailscale_info.txt" `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Cleanup complete."
