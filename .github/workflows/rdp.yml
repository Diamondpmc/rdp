name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication (NLA)"
        required: true
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: true
        default: false
        type: boolean

      install_firefox:
        description: "Install Firefox"
        required: true
        default: false
        type: boolean

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    permissions:
      contents: read

    env:
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

    steps:

      # ==========================================================
      # 1. CHECK TAILSCALE SECRET
      # ==========================================================
      - name: Check Tailscale secret
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              Write-Host ""
              Write-Host "ERROR: TAILSCALE_AUTH_KEY is empty."
              Write-Host ""
              Write-Host "Go to:"
              Write-Host "Repository -> Settings -> Secrets and variables -> Actions"
              Write-Host ""
              Write-Host "The repository secret must be named exactly:"
              Write-Host "TAILSCALE_AUTH_KEY"
              Write-Host ""
              exit 1
          }

          $key = $env:TAILSCALE_AUTH_KEY.Trim()

          if ([string]::IsNullOrWhiteSpace($key)) {
              throw "TAILSCALE_AUTH_KEY contains no usable value."
          }

          Write-Host "Tailscale secret was provided."
          Write-Host "Secret length: $($key.Length)"
          Write-Host "Secret itself will NOT be displayed."

      # ==========================================================
      # 2. ENABLE WINDOWS REMOTE DESKTOP
      # ==========================================================
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Use standard RDP security
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1

          if ("${{ inputs.disable_nla }}" -eq "true") {
              Write-Host "Disabling NLA..."
              Set-ItemProperty `
                -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
                -Name "UserAuthentication" `
                -Value 0
          }
          else {
              Write-Host "NLA remains enabled."
              Set-ItemProperty `
                -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
                -Name "UserAuthentication" `
                -Value 1
          }

          Restart-Service TermService -Force

          Write-Host "Remote Desktop service enabled."

      # ==========================================================
      # 3. CREATE RDP USER
      # ==========================================================
      - name: Create RDP user
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = "RDP"

          # Generate random password
          $chars = (
              "ABCDEFGHJKLMNPQRSTUVWXYZ" +
              "abcdefghijkmnopqrstuvwxyz" +
              "23456789" +
              "!@#$%^&*_-+="
          ).ToCharArray()

          $passwordChars = 1..20 | ForEach-Object {
              $chars | Get-Random
          }

          $password = -join $passwordChars

          $securePassword = ConvertTo-SecureString `
              $password `
              -AsPlainText `
              -Force

          $existingUser = Get-LocalUser -Name $username -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "RDP user already exists. Updating password..."
              Set-LocalUser `
                -Name $username `
                -Password $securePassword
          }
          else {
              Write-Host "Creating RDP user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "Temporary GitHub Actions RDP user"
          }

          # Remove from Administrators if present
          Remove-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Add to Remote Desktop Users
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Mask password if accidentally echoed
          Write-Output "::add-mask::$password"

          # Save credentials only for this workflow runner
          $credentialFile = Join-Path `
            $env:RUNNER_TEMP `
            "rdp-credential.txt"

          Set-Content `
            -Path $credentialFile `
            -Value $password `
            -NoNewline

          "RDP_USERNAME=$username" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          "RDP_CREDENTIAL_FILE=$credentialFile" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          Write-Host "RDP user ready."

      # ==========================================================
      # 4. DISABLE STANDARD RDP FIREWALL RULES
      # ==========================================================
      - name: Configure RDP firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Removing broad Windows RDP firewall exposure..."

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Remove old custom rule if it exists
          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          Write-Host "Creating Tailscale-only RDP firewall rule..."

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Write-Host "Firewall configured."

      # ==========================================================
      # 5. CONNECT TO TAILSCALE
      # ==========================================================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          args: "--hostname=gh-rdp-${{ github.run_id }}"

      # ==========================================================
      # 6. GET TAILSCALE IP
      # ==========================================================
      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Waiting for Tailscale IPv4 address..."

          $ip = $null

          for ($i = 1; $i -le 30; $i++) {

              $result = & tailscale ip -4 2>$null

              if ($LASTEXITCODE -eq 0 -and $result) {

                  $candidate = ($result | Select-Object -First 1).Trim()

                  if ($candidate -match '^100\.\d+\.\d+\.\d+$') {
                      $ip = $candidate
                      break
                  }
              }

              Write-Host "Attempt $i/30 - waiting..."
              Start-Sleep -Seconds 2
          }

          if (-not $ip) {
              Write-Host ""
              Write-Host "Could not obtain a Tailscale IPv4 address."
              Write-Host ""
              tailscale status
              throw "Tailscale IPv4 address was not available."
          }

          Write-Host "Tailscale IPv4: $ip"

          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

      # ==========================================================
      # 7. VERIFY RDP SERVICE
      # ==========================================================
      - name: Verify RDP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Checking Remote Desktop service..."

          $service = Get-Service TermService

          if ($service.Status -ne "Running") {
              throw "Remote Desktop service is not running."
          }

          Write-Host "TermService: Running"

          Write-Host "Checking TCP 3389..."

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              throw "TCP 3389 is not listening."
          }

          Write-Host "TCP 3389: Listening"

          Write-Host "Checking firewall rule..."

          $rule = Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          if (-not $rule) {
              throw "RDP-Tailscale firewall rule does not exist."
          }

          if ($rule.Enabled -ne "True") {
              throw "RDP-Tailscale firewall rule is disabled."
          }

          Write-Host "Firewall: RDP-Tailscale enabled"

          Write-Host ""
          Write-Host "RDP service is ready."

      # ==========================================================
      # 8. OPTIONAL CHROME
      # ==========================================================
      - name: Install Chrome
        if: ${{ inputs.install_chrome }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Google Chrome..."

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "chrome-installer.exe"

          Invoke-WebRequest `
            -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/silent","/install" `
            -Wait

          Write-Host "Chrome installation completed."

      # ==========================================================
      # 9. OPTIONAL FIREFOX
      # ==========================================================
      - name: Install Firefox
        if: ${{ inputs.install_firefox }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Installing Firefox..."

          $installer = Join-Path `
            $env:RUNNER_TEMP `
            "firefox-installer.exe"

          Invoke-WebRequest `
            -Uri "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/S" `
            -Wait

          Write-Host "Firefox installation completed."

      # ==========================================================
      # 10. DISPLAY CONNECTION INFORMATION
      # ==========================================================
      - name: RDP connection information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host "          RDP CONNECTION READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host "RDP Port     : 3389"
          Write-Host "NLA          : ${{ inputs.disable_nla == false }}"
          Write-Host ""
          Write-Host "Connect using:"
          Write-Host ""
          Write-Host "mstsc /v:$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""

      # ==========================================================
      # 11. KEEP RUNNER ALIVE
      # ==========================================================
      - name: Keep RDP session alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "RDP SESSION IS ACTIVE"
          Write-Host "The runner will remain alive until the workflow ends."
          Write-Host ""

          while ($true) {

              Write-Host ""
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Health check"

              # RDP service
              $service = Get-Service TermService -ErrorAction SilentlyContinue

              if ($service -and $service.Status -eq "Running") {
                  Write-Host "RDP service: OK"
              }
              else {
                  Write-Host "RDP service: NOT RUNNING"
              }

              # Port
              $listener = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  Write-Host "TCP 3389: OK"
              }
              else {
                  Write-Host "TCP 3389: NOT LISTENING"
              }

              # Tailscale
              $ts = & tailscale ip -4 2>$null

              if ($ts) {
                  Write-Host "Tailscale: OK"
                  Write-Host "IP: $ts"
              }
              else {
                  Write-Host "Tailscale: NOT AVAILABLE"
              }

              Start-Sleep -Seconds 300
          }

      # ==========================================================
      # 12. CLEANUP
      # ==========================================================
      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Cleaning up..."

          # Remove firewall rule
          Remove-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue

          # Remove RDP user
          Remove-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          # Delete credential file
          if ($env:RDP_CREDENTIAL_FILE) {
              Remove-Item `
                -Path $env:RDP_CREDENTIAL_FILE `
                -Force `
                -ErrorAction SilentlyContinue
          }

          # Disconnect Tailscale
          if (Get-Command tailscale -ErrorAction SilentlyContinue) {
              tailscale logout
          }

          Write-Host "Cleanup complete."
