name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication"
        required: true
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: true
        default: false
        type: boolean

      install_firefox:
        description: "Install Mozilla Firefox"
        required: true
        default: false
        type: boolean


jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDP
      RDP_PASSWORD: "RDP@2522!Win2026"

    steps:

      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=============================================="
          Write-Host ""

          $Username = $env:RDP_USERNAME
          $Password = $env:RDP_PASSWORD

          Write-Host "Username: $Username"
          Write-Host "Password length: $($Password.Length)"

          # Check password requirements before creating the account
          if ($Password.Length -lt 14) {
              throw "Password must contain at least 14 characters."
          }

          if ($Password -notmatch '[A-Z]') {
              throw "Password does not contain an uppercase letter."
          }

          if ($Password -notmatch '[a-z]') {
              throw "Password does not contain a lowercase letter."
          }

          if ($Password -notmatch '[0-9]') {
              throw "Password does not contain a number."
          }

          if ($Password -notmatch '[^a-zA-Z0-9]') {
              throw "Password does not contain a special character."
          }

          $SecurePassword = ConvertTo-SecureString `
            $Password `
            -AsPlainText `
            -Force

          $ExistingUser = Get-LocalUser `
            -Name $Username `
            -ErrorAction SilentlyContinue

          if ($ExistingUser) {

              Write-Host "User '$Username' already exists."
              Write-Host "Updating password..."

              Set-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -PasswordNeverExpires $true

          }
          else {

              Write-Host "Creating user '$Username'..."

              New-LocalUser `
                -Name $Username `
                -Password $SecurePassword `
                -FullName "RDP User" `
                -Description "GitHub Actions RDP User" `
                -PasswordNeverExpires `
                -AccountNeverExpires
          }

          Write-Host "Adding user to Administrators..."

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host "Adding user to Remote Desktop Users..."

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $Username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP USER CREATED SUCCESSFULLY"
          Write-Host "Username: $Username"
          Write-Host "Password: $Password"
          Write-Host ""


      # ============================================================
      # ENABLE REMOTE DESKTOP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fSingleSessionPerUser" `
            -Value 0

          Write-Host "Remote Desktop enabled."


      # ============================================================
      # CONFIGURE NLA
      # ============================================================

      - name: Configure Network Level Authentication
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONFIGURING NLA"
          Write-Host "=============================================="
          Write-Host ""

          if ("${{ inputs.disable_nla }}" -eq "true") {

              Write-Host "Disabling Network Level Authentication..."

              Set-ItemProperty `
                -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
                -Name "UserAuthentication" `
                -Value 0

              Write-Host "NLA disabled."

          }
          else {

              Write-Host "Keeping Network Level Authentication enabled..."

              Set-ItemProperty `
                -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
                -Name "UserAuthentication" `
                -Value 1

              Write-Host "NLA enabled."
          }


      # ============================================================
      # START RDP SERVICE
      # ============================================================

      - name: Start Remote Desktop Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " STARTING REMOTE DESKTOP SERVICE"
          Write-Host "=============================================="
          Write-Host ""

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $Service = Get-Service -Name "TermService"

          Write-Host "TermService: $($Service.Status)"

          if ($Service.Status -ne "Running") {
              throw "Remote Desktop service is not running."
          }


      # ============================================================
      # FIREWALL
      # ============================================================

      - name: Configure RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONFIGURING RDP FIREWALL"
          Write-Host "=============================================="
          Write-Host ""

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          $Rule = Get-NetFirewallRule `
            -DisplayName "Allow RDP TCP 3389" `
            -ErrorAction SilentlyContinue

          if (-not $Rule) {

              New-NetFirewallRule `
                -DisplayName "Allow RDP TCP 3389" `
                -Direction Inbound `
                -Protocol TCP `
                -LocalPort 3389 `
                -Action Allow `
                -Profile Any

          }
          else {

              Set-NetFirewallRule `
                -DisplayName "Allow RDP TCP 3389" `
                -Enabled True `
                -Action Allow
          }

          Write-Host "Firewall configured."


      # ============================================================
      # RESTART RDP
      # ============================================================

      - name: Restart Remote Desktop Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 5

          $Service = Get-Service -Name "TermService"

          if ($Service.Status -ne "Running") {
              throw "TermService failed to start."
          }

          Write-Host "TermService is running."


      # ============================================================
      # VERIFY RDP LISTENER
      # ============================================================

      - name: Verify RDP Port
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING TCP 3389"
          Write-Host "=============================================="
          Write-Host ""

          Start-Sleep -Seconds 3

          $Listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $Listener) {

              Write-Host "TCP 3389 is NOT listening."

              Write-Host ""
              Write-Host "Current listeners:"

              Get-NetTCPConnection `
                -State Listen |
                Sort-Object LocalPort |
                Format-Table -AutoSize

              throw "RDP is not listening on TCP 3389."
          }

          Write-Host "TCP 3389 IS LISTENING."
          Write-Host ""

          $Listener |
            Format-Table LocalAddress, LocalPort, State, OwningProcess -AutoSize


      # ============================================================
      # LOCAL RDP TEST
      # ============================================================

      - name: Test Local RDP Connection
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Testing 127.0.0.1:3389..."

          $Test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "TcpTestSucceeded: $($Test.TcpTestSucceeded)"

          if (-not $Test.TcpTestSucceeded) {
              throw "Local RDP TCP connection failed."
          }

          Write-Host "LOCAL RDP TEST PASSED."


      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal


      # ============================================================
      # GET TAILSCALE IP
      # ============================================================

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " GETTING TAILSCALE IP"
          Write-Host "=============================================="
          Write-Host ""

          $IPv4 = tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($IPv4)) {
              throw "Unable to obtain Tailscale IPv4 address."
          }

          $IPv4 = $IPv4.Trim()

          Write-Host "Tailscale IPv4: $IPv4"

          "TAILSCALE_IP=$IPv4" >> $env:GITHUB_ENV


      # ============================================================
      # VERIFY TAILSCALE
      # ============================================================

      - name: Verify Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE STATUS"
          Write-Host "=============================================="
          Write-Host ""

          tailscale status

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP


      # ============================================================
      # TEST TAILSCALE RDP
      # ============================================================

      - name: Test RDP Through Tailscale
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TESTING RDP THROUGH TAILSCALE"
          Write-Host "=============================================="
          Write-Host ""

          $IP = $env:TAILSCALE_IP

          Write-Host "Testing $IP`:3389"
          Write-Host ""

          $Test = Test-NetConnection `
            -ComputerName $IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "RemoteAddress: $($Test.RemoteAddress)"
          Write-Host "RemotePort: $($Test.RemotePort)"
          Write-Host "TcpTestSucceeded: $($Test.TcpTestSucceeded)"
          Write-Host ""

          if (-not $Test.TcpTestSucceeded) {

              Write-Host "=============================================="
              Write-Host " TAILSCALE RDP TEST FAILED"
              Write-Host "=============================================="
              Write-Host ""

              Write-Host "RDP listener:"
              Get-NetTCPConnection `
                -LocalPort 3389 `
                -ErrorAction SilentlyContinue |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "Network configuration:"
              Get-NetIPConfiguration |
                Format-Table -AutoSize

              throw "TCP 3389 is not reachable through Tailscale."
          }

          Write-Host "TAILSCALE RDP TEST PASSED."


      # ============================================================
      # CONNECTION INFORMATION
      # ============================================================

      - name: Display RDP Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                    RDP READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Computer:"
          Write-Host "$env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "$env:RDP_USERNAME"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "Port:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""


      # ============================================================
      # OPTIONAL CHROME
      # ============================================================

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "Installing Google Chrome..."

          $ChromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $Installed = $false

          foreach ($Path in $ChromePaths) {

              if ($Path -and (Test-Path $Path)) {

                  Write-Host "Chrome already installed: $Path"

                  $Installed = $true
                  break
              }
          }

          if (-not $Installed) {

              winget install `
                --id Google.Chrome `
                --exact `
                --source winget `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Chrome installation failed."
              }
          }


      # ============================================================
      # OPTIONAL FIREFOX
      # ============================================================

      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "Installing Mozilla Firefox..."

          $FirefoxPaths = @(
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe"
          )

          $Installed = $false

          foreach ($Path in $FirefoxPaths) {

              if ($Path -and (Test-Path $Path)) {

                  Write-Host "Firefox already installed: $Path"

                  $Installed = $true
                  break
              }
          }

          if (-not $Installed) {

              winget install `
                --id Mozilla.Firefox `
                --exact `
                --source winget `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements `
                --disable-interactivity

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Firefox installation failed."
              }
          }


      # ============================================================
      # FINAL HEALTH CHECK
      # ============================================================

      - name: Final RDP Health Check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FINAL HEALTH CHECK"
          Write-Host "=============================================="
          Write-Host ""

          $Service = Get-Service -Name "TermService"

          if ($Service.Status -ne "Running") {
              throw "TermService is not running."
          }

          Write-Host "TermService: RUNNING"

          $Listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $Listener) {
              throw "TCP 3389 is not listening."
          }

          Write-Host "TCP 3389: LISTENING"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " ALL RDP CHECKS PASSED"
          Write-Host "=============================================="


      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: Keep RDP Session Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP SESSION ACTIVE"
          Write-Host "============================================================"
          Write-Host ""

          Write-Host "Computer:"
          Write-Host "$env:TAILSCALE_IP`:3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "$env:RDP_USERNAME"

          Write-Host ""
          Write-Host "Password:"
          Write-Host "$env:RDP_PASSWORD"

          Write-Host ""

          for ($i = 1; $i -le 350; $i++) {

              Start-Sleep -Seconds 60

              $Service = Get-Service `
                -Name "TermService" `
                -ErrorAction SilentlyContinue

              $Listener = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              $Tailscale = Get-Process `
                -Name "tailscaled" `
                -ErrorAction SilentlyContinue

              Write-Host "[$i/350] RDP=$($Service.Status) | Port3389=$([bool]$Listener) | Tailscale=$([bool]$Tailscale)"

              if (-not $Service -or $Service.Status -ne "Running") {

                  Write-Warning "TermService stopped. Restarting..."

                  Start-Service `
                    -Name "TermService" `
                    -ErrorAction SilentlyContinue
              }
          }

          Write-Host ""
          Write-Host "Keep-alive period completed."
