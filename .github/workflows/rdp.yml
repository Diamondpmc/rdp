name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication (NLA)"
        required: false
        type: boolean
        default: false

      install_chrome:
        description: "Install Google Chrome"
        required: false
        type: boolean
        default: false

      install_firefox:
        description: "Install Mozilla Firefox"
        required: false
        type: boolean
        default: false

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDP

    steps:

      # ============================================================
      # BASIC SYSTEM INFORMATION
      # ============================================================

      - name: System Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " WINDOWS RDP RUNNER"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Computer Name:"
          $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Windows Version:"
          Get-ComputerInfo |
            Select-Object WindowsProductName, WindowsVersion, OsBuildNumber

          Write-Host ""
          Write-Host "Current User:"
          whoami


      # ============================================================
      # ENABLE REMOTE DESKTOP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="
          Write-Host ""

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          Write-Host "Remote Desktop enabled."


      # ============================================================
      # OPTIONAL NLA DISABLE
      # ============================================================

      - name: Configure NLA
        if: ${{ inputs.disable_nla }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " DISABLING NLA"
          Write-Host "=============================================="
          Write-Host ""

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 0

          Write-Host "NLA disabled."


      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: Create RDP User
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=============================================="
          Write-Host ""

          $username = $env:RDP_USERNAME

          # Generate a strong random password.
          Add-Type -AssemblyName System.Web

          do {
              $password = [System.Web.Security.Membership]::GeneratePassword(32, 8)
          } while (
              $password -notmatch '[A-Z]' -or
              $password -notmatch '[a-z]' -or
              $password -notmatch '[0-9]' -or
              $password -notmatch '[^a-zA-Z0-9]' -or
              $password.ToLower().Contains($username.ToLower())
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existingUser) {
              Write-Host "User already exists. Updating password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -Description "GitHub Actions RDP User"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          "RDP_USERNAME=$username" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "RDP user created:"
          Write-Host $username

          Write-Host ""
          Write-Host "A new random password was generated for this run."


      # ============================================================
      # RESTART RDP SERVICE
      # ============================================================

      - name: Restart RDP Service
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RESTARTING RDP SERVICE"
          Write-Host "=============================================="
          Write-Host ""

          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Start-Sleep -Seconds 5

          Get-Service TermService |
            Format-List Name, Status, StartType

          Write-Host ""
          Write-Host "RDP service restarted."


      # ============================================================
      # CONNECT TO TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal


      # ============================================================
      # GET TAILSCALE INFORMATION
      # ============================================================

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE INFORMATION"
          Write-Host "=============================================="
          Write-Host ""

          $tailscaleIP = & tailscale ip -4

          if (-not $tailscaleIP) {
              Write-Error "Could not obtain Tailscale IPv4 address."
              exit 1
          }

          $tailscaleIP = $tailscaleIP.Trim()

          "TAILSCALE_IP=$tailscaleIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IPv4:"
          Write-Host $tailscaleIP

          Write-Host ""
          Write-Host "Tailscale Status:"
          & tailscale status

          Write-Host ""
          Write-Host "Tailscale IPs:"
          & tailscale ip


      # ============================================================
      # CONFIGURE WINDOWS FIREWALL
      # ============================================================

      - name: Configure RDP Firewall
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " CONFIGURING RDP FIREWALL"
          Write-Host "=============================================="
          Write-Host ""

          # Enable Windows Remote Desktop firewall rules.
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          # Remove old custom rules if they exist.
          Get-NetFirewallRule `
            -DisplayName "GitHub Actions RDP 3389" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          Get-NetFirewallRule `
            -DisplayName "GitHub Actions RDP Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule `
            -ErrorAction SilentlyContinue

          # --------------------------------------------------------
          # GENERAL TCP 3389 RULE
          # --------------------------------------------------------

          Write-Host "Creating general TCP 3389 rule..."

          New-NetFirewallRule `
            -DisplayName "GitHub Actions RDP 3389" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress Any `
            -Action Allow `
            -Profile Any `
            -Enabled True

          # --------------------------------------------------------
          # TAILSCALE-SPECIFIC RULE
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Creating Tailscale-specific TCP 3389 rule..."

          New-NetFirewallRule `
            -DisplayName "GitHub Actions RDP Tailscale" `
            -Direction Inbound `
            -InterfaceAlias "Tailscale" `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Action Allow `
            -Profile Any `
            -Enabled True

          Write-Host ""
          Write-Host "Firewall rules created."

          # --------------------------------------------------------
          # VERIFY CUSTOM RULES
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== CUSTOM RDP RULES ==="

          Get-NetFirewallRule |
            Where-Object {
              $_.DisplayName -eq "GitHub Actions RDP 3389" -or
              $_.DisplayName -eq "GitHub Actions RDP Tailscale"
            } |
            Select-Object `
              DisplayName,
              Enabled,
              Profile,
              Direction,
              Action |
            Format-Table -AutoSize

          # --------------------------------------------------------
          # VERIFY PORT FILTER
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== TAILSCALE RDP PORT FILTER ==="

          Get-NetFirewallRule `
            -DisplayName "GitHub Actions RDP Tailscale" |
            Get-NetFirewallPortFilter |
            Format-List *

          # --------------------------------------------------------
          # VERIFY ADDRESS FILTER
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== TAILSCALE RDP ADDRESS FILTER ==="

          Get-NetFirewallRule `
            -DisplayName "GitHub Actions RDP Tailscale" |
            Get-NetFirewallAddressFilter |
            Format-List *

          # --------------------------------------------------------
          # VERIFY TAILSCALE INTERFACE
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "=== TAILSCALE INTERFACE ==="

          Get-NetAdapter `
            -Name "Tailscale" |
            Format-List `
              Name,
              InterfaceDescription,
              Status,
              ifIndex

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE-SPECIFIC RDP FIREWALL READY"
          Write-Host "=============================================="
          Write-Host ""


      # ============================================================
      # VERIFY NETWORK PROFILES
      # ============================================================

      - name: Verify Network Profiles
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " NETWORK PROFILES"
          Write-Host "=============================================="
          Write-Host ""

          Get-NetConnectionProfile |
            Format-Table `
              Name,
              InterfaceAlias,
              NetworkCategory,
              IPv4Connectivity,
              IPv6Connectivity `
              -AutoSize

          Write-Host ""
          Write-Host "Firewall Profiles:"

          Get-NetFirewallProfile |
            Select-Object `
              Name,
              Enabled,
              DefaultInboundAction,
              DefaultOutboundAction |
            Format-Table -AutoSize


      # ============================================================
      # VERIFY RDP LISTENER
      # ============================================================

      - name: Verify RDP Listener
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING RDP LISTENER"
          Write-Host "=============================================="
          Write-Host ""

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
              Write-Error "RDP listener was not detected."
              exit 1
          }

          Write-Host "RDP listener detected."

          $listener |
            Select-Object `
              LocalAddress,
              LocalPort,
              State,
              OwningProcess |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Checking TCP 3389..."

          $tcpCheck = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 3389

          $tcpCheck |
            Format-List

          if (-not $tcpCheck.TcpTestSucceeded) {
              Write-Error "LOCAL RDP TEST FAILED."
              exit 1
          }

          Write-Host ""
          Write-Host "LOCAL RDP TEST: SUCCESS"


      # ============================================================
      # VERIFY TAILSCALE INTERFACE
      # ============================================================

      - name: Verify Tailscale Interface
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " VERIFYING TAILSCALE INTERFACE"
          Write-Host "=============================================="
          Write-Host ""

          Get-NetAdapter |
            Where-Object {
              $_.Name -eq "Tailscale" -or
              $_.InterfaceDescription -like "*Tailscale*"
            } |
            Format-Table `
              Name,
              InterfaceDescription,
              Status,
              ifIndex `
              -AutoSize

          Write-Host ""
          Write-Host "Tailscale routes:"

          Get-NetRoute |
            Where-Object {
              $_.InterfaceAlias -eq "Tailscale"
            } |
            Sort-Object DestinationPrefix |
            Format-Table `
              DestinationPrefix,
              NextHop,
              InterfaceAlias,
              RouteMetric `
              -AutoSize


      # ============================================================
      # TAILSCALE NETWORK DIAGNOSTICS
      # ============================================================

      - name: Tailscale Diagnostics
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE DIAGNOSTICS"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Tailscale status:"
          & tailscale status

          Write-Host ""
          Write-Host "Tailscale netcheck:"
          & tailscale netcheck

          Write-Host ""
          Write-Host "Tailscale ping self:"
          & tailscale ping $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""
          Write-Host "=============================================="
          Write-Host " TAILSCALE DIAGNOSTICS COMPLETE"
          Write-Host "=============================================="


      # ============================================================
      # OPTIONAL GOOGLE CHROME
      # ============================================================

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Installing Google Chrome..."

          $installer = "$env:TEMP\chrome_installer.exe"

          Invoke-WebRequest `
            -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "/silent", "/install" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Chrome installation complete."


      # ============================================================
      # OPTIONAL FIREFOX
      # ============================================================

      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host ""
          Write-Host "Installing Mozilla Firefox..."

          $installer = "$env:TEMP\firefox_installer.exe"

          Invoke-WebRequest `
            -Uri "https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US" `
            -OutFile $installer

          Start-Process `
            -FilePath $installer `
            -ArgumentList "-ms" `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Firefox installation complete."


      # ============================================================
      # FINAL CONNECTION INFORMATION
      # ============================================================

      - name: Display RDP Connection Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host ""
          Write-Host "============================================================"
          Write-Host "                 RDP CONNECTION READY"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "RDP Address:"
          Write-Host "$env:TAILSCALE_IP`:3389"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "$env:RDP_USERNAME"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " IMPORTANT"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Use the Tailscale IP above."
          Write-Host "Do NOT use the GitHub runner public IP."
          Write-Host ""
          Write-Host "============================================================"
          Write-Host ""


      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================

      - name: Keep RDP Session Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "============================================================"
          Write-Host " RDP SESSION IS RUNNING"
          Write-Host "============================================================"
          Write-Host ""
          Write-Host "Tailscale IP : $env:TAILSCALE_IP"
          Write-Host "RDP Port     : 3389"
          Write-Host "Username     : $env:RDP_USERNAME"
          Write-Host ""
          Write-Host "Runner will remain active until:"
          Write-Host "- The workflow reaches its timeout"
          Write-Host "- The workflow is manually cancelled"
          Write-Host "- The GitHub-hosted runner terminates"
          Write-Host ""

          while ($true) {

              Write-Host ""
              Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP heartbeat"

              $rdp = Get-Service `
                -Name TermService `
                -ErrorAction SilentlyContinue

              if ($rdp) {
                  Write-Host "TermService: $($rdp.Status)"
              }

              $listener = Get-NetTCPConnection `
                -LocalPort 3389 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($listener) {
                  Write-Host "TCP 3389: LISTENING"
              }
              else {
                  Write-Host "TCP 3389: NOT LISTENING"
              }

              $ts = & tailscale ip -4 2>$null

              if ($ts) {
                  Write-Host "Tailscale IP: $ts"
              }
              else {
                  Write-Host "Tailscale IP: unavailable"
              }

              Start-Sleep -Seconds 60
          }
