
name: RDP

on:
  workflow_dispatch:
    inputs:
      disable_nla:
        description: "Disable Network Level Authentication"
        required: false
        default: false
        type: boolean

      install_chrome:
        description: "Install Google Chrome"
        required: false
        default: false
        type: boolean

      install_firefox:
        description: "Install Mozilla Firefox"
        required: false
        default: false
        type: boolean

jobs:
  secure-rdp:
    name: Windows RDP
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USERNAME: RDP
      RDP_PASSWORD: "2522"

    steps:

      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " WINDOWS RDP RUNNER"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Computer Name:"
          Write-Host $env:COMPUTERNAME
          Write-Host ""
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture |
            Format-List

      # ============================================================
      # CREATE RDP USER
      # ============================================================

      - name: Create RDP user
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME
          $password = $env:RDP_PASSWORD

          Write-Host "=============================================="
          Write-Host " CREATING RDP USER"
          Write-Host "=============================================="

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -ne $existingUser) {
            Write-Host "User '$username' already exists."
            Write-Host "Updating password..."

            Set-LocalUser `
              -Name $username `
              -Password $securePassword

            Enable-LocalUser -Name $username
          }
          else {
            Write-Host "Creating user '$username'..."

            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -AccountNeverExpires `
              -PasswordNeverExpires `
              -UserMayNotChangePassword `
              -Description "GitHub Actions RDP User"
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP USER READY"
          Write-Host "Username: $username"
          Write-Host "Password: $password"

      # ============================================================
      # ENABLE RDP
      # ============================================================

      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " ENABLING REMOTE DESKTOP"
          Write-Host "=============================================="

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Type DWord `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService" `
            -ErrorAction SilentlyContinue

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          Write-Host "Remote Desktop enabled."

      # ============================================================
      # NLA
      # ============================================================

      - name: Configure Network Level Authentication
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $rdpPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp"

          if ("${{ inputs.disable_nla }}" -eq "true") {

            Write-Host "NLA: DISABLED"

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 0

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "SecurityLayer" `
              -Type DWord `
              -Value 0
          }
          else {

            Write-Host "NLA: ENABLED"

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "UserAuthentication" `
              -Type DWord `
              -Value 1

            Set-ItemProperty `
              -Path $rdpPath `
              -Name "SecurityLayer" `
              -Type DWord `
              -Value 1
          }

      # ============================================================
      # RESTART RDP
      # ============================================================

      - name: Restart Remote Desktop service
        shell: powershell
        run: |
          Write-Host "Restarting Remote Desktop service..."

          Restart-Service `
            -Name "TermService" `
            -Force `
            -ErrorAction SilentlyContinue

          Start-Sleep -Seconds 5

          $service = Get-Service -Name "TermService"

          Write-Host "TermService status: $($service.Status)"

          if ($service.Status -ne "Running") {
            Write-Error "Remote Desktop service is not running."
            exit 1
          }

      # ============================================================
      # VERIFY LOCAL 3389
      # ============================================================

      - name: Verify RDP listener
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " CHECKING TCP 3389"
          Write-Host "=============================================="

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            Write-Host ""
            Write-Host "ERROR: RDP is NOT listening on TCP 3389."
            Write-Host ""

            Get-Service -Name "TermService" |
              Format-List Name, Status, StartType

            exit 1
          }

          Write-Host ""
          Write-Host "SUCCESS: TCP 3389 IS LISTENING."
          Write-Host ""

          $listener |
            Select-Object LocalAddress, LocalPort, State, OwningProcess |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "Testing local connection..."

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "Local TCP 3389: $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
            Write-Error "Local TCP 3389 test failed."
            exit 1
          }

      # ============================================================
      # FIREWALL
      # ============================================================

      - name: Configure RDP firewall
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " CONFIGURING FIREWALL"
          Write-Host "=============================================="

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "Allow RDP TCP 3389" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -Action Allow `
            -Profile Any `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "RDP firewall rules configured."

      # ============================================================
      # TAILSCALE
      # ============================================================

      - name: Connect to Tailscale
        id: tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest
          hostname: gh-rdp-${{ github.run_id }}
          timeout: 2m
          retry: 5
          log-mode: normal

      # ============================================================
      # GET TAILSCALE IP
      # ============================================================

      - name: Get Tailscale IP
        id: tailscale-ip
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=============================================="
          Write-Host " TAILSCALE IP"
          Write-Host "=============================================="

          Start-Sleep -Seconds 3

          $ip = tailscale ip -4

          if ([string]::IsNullOrWhiteSpace($ip)) {
            Write-Error "Could not obtain Tailscale IPv4 address."
            exit 1
          }

          $ip = $ip.Trim()

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          "ip=$ip" >> $env:GITHUB_OUTPUT

          Write-Host ""
          Write-Host "Tailscale IPv4:"
          Write-Host $ip

      # ============================================================
      # TAILSCALE STATUS
      # ============================================================

      - name: Verify Tailscale connection
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " TAILSCALE STATUS"
          Write-Host "=============================================="

          tailscale status

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

      # ============================================================
      # TEST RDP THROUGH TAILSCALE
      # ============================================================

      - name: Test RDP through Tailscale
        shell: powershell
        run: |
          Write-Host "=============================================="
          Write-Host " TESTING TAILSCALE TCP 3389"
          Write-Host "=============================================="

          $test = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host ""
          Write-Host "Target: $env:TAILSCALE_IP"
          Write-Host "Port: 3389"
          Write-Host "TCP Test: $($test.TcpTestSucceeded)"

          if ($test.TcpTestSucceeded) {
            Write-Host ""
            Write-Host "SUCCESS: Tailscale TCP 3389 is reachable."
          }
          else {
            Write-Warning "Tailscale TCP 3389 test did not succeed from the runner itself."
            Write-Warning "This does not necessarily mean the RDP service is broken."
          }

      # ============================================================
      # CONNECTION INFORMATION
      # ============================================================

      - name: Display RDP connection information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "================================================"
          Write-Host "            RDP IS READY"
          Write-Host "================================================"
          Write-Host ""
          Write-Host "RDP ADDRESS:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "PORT:"
          Write-Host "3389"
          Write-Host ""
          Write-Host "USERNAME:"
          Write-Host "RDP"
          Write-Host ""
          Write-Host "PASSWORD:"
          Write-Host "2522"
          Write-Host ""
          Write-Host "================================================"
          Write-Host ""
          Write-Host "Use Windows Remote Desktop Connection."
          Write-Host ""
          Write-Host "Computer:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "RDP"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "2522"
          Write-Host ""
          Write-Host "================================================"

      # ============================================================
      # OPTIONAL CHROME
      # ============================================================

      - name: Install Google Chrome
        if: ${{ inputs.install_chrome }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=============================================="
          Write-Host " INSTALLING GOOGLE CHROME"
          Write-Host "=============================================="

          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )

          $installed = $false

          foreach ($path in $chromePaths) {
            if (Test-Path $path) {
              Write-Host "Chrome already installed:"
              Write-Host $path
              $installed = $true
              break
            }
          }

          if (-not $installed) {
            Write-Host "Installing Chrome..."

            winget install `
              --id Google.Chrome `
              --exact `
              --source winget `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Chrome installation failed."
              Write-Warning "RDP will continue running."
            }
            else {
              Write-Host "Chrome installed successfully."
            }
          }

      # ============================================================
      # OPTIONAL FIREFOX
      # ============================================================

      - name: Install Mozilla Firefox
        if: ${{ inputs.install_firefox }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=============================================="
          Write-Host " INSTALLING MOZILLA FIREFOX"
          Write-Host "=============================================="

          $firefoxPaths = @(
            "$env:ProgramFiles\Mozilla Firefox\firefox.exe",
            "${env:ProgramFiles(x86)}\Mozilla Firefox\firefox.exe",
            "$env:LOCALAPPDATA\Mozilla Firefox\firefox.exe"
          )

          $installed = $false

          foreach ($path in $firefoxPaths) {
            if (Test-Path $path) {
              Write-Host "Firefox already installed:"
              Write-Host $path
              $installed = $true
              break
            }
          }

          if (-not $installed) {
            Write-Host "Installing Firefox..."

            winget install `
              --id Mozilla.Firefox `
              --exact `
              --source winget `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements `
              --disable-interactivity

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Firefox installation failed."
              Write-Warning "RDP will continue running."
            }
            else {
              Write-Host "Firefox installed successfully."
            }
          }

      # ============================================================
      # FINAL HEALTH CHECK
      # ============================================================

      - name: Final RDP health check
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " FINAL RDP HEALTH CHECK"
          Write-Host "=============================================="
          Write-Host ""

          $service = Get-Service -Name "TermService"

          if ($service.Status -ne "Running") {
            Write-Error "Remote Desktop service is not running."
            exit 1
          }

          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($null -eq $listener) {
            Write-Error "RDP is not listening on TCP 3389."
            exit 1
          }

          Write-Host "Remote Desktop Service: RUNNING"
          Write-Host "TCP 3389: LISTENING"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "RDP IS READY."
          Write-Host ""

      # ============================================================
      # KEEP ALIVE
      # ============================================================

      - name: Keep RDP alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=============================================="
          Write-Host " RDP SESSION ACTIVE"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Port    : 3389"
          Write-Host "Username: RDP"
          Write-Host "Password: 2522"
          Write-Host ""
          Write-Host "Maximum runtime: approximately 350 minutes."
          Write-Host ""

          $endTime = (Get-Date).AddMinutes(350)

          while ((Get-Date) -lt $endTime) {

            $remaining = $endTime - (Get-Date)

            Write-Host (
              "[{0}] RDP alive - {1} remaining" -f `
              (Get-Date -Format "HH:mm:ss"), `
              $remaining.ToString("hh\:mm\:ss")
            )

            $service = Get-Service `
              -Name "TermService" `
              -ErrorAction SilentlyContinue

            if ($null -ne $service) {
              if ($service.Status -ne "Running") {
                Write-Warning "TermService stopped. Restarting..."

                Start-Service `
                  -Name "TermService" `
                  -ErrorAction SilentlyContinue
              }
            }

            $listener = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($null -eq $listener) {
              Write-Warning "TCP 3389 is not listening."
              Write-Warning "Restarting Remote Desktop service..."

              Restart-Service `
                -Name "TermService" `
                -Force `
                -ErrorAction SilentlyContinue
            }

            Start-Sleep -Seconds 60
          }

          Write-Host ""
          Write-Host "Keepalive period completed."
